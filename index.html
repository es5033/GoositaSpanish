}

let quizBuilderState = { sections: [] };
function openQuizBuilder(editId = null) {
  let quiz = editId ? state.quizzes.find(q => q.id === editId) : null;
  quizBuilderState = {
    id: quiz ? quiz.id : null, title: quiz ? quiz.title : '', description: quiz ? quiz.description : '',
    category: quiz ? quiz.category : 'Vocabulary', rewardBadgeId: quiz ? quiz.rewardBadgeId : null,
    sections: quiz ? JSON.parse(JSON.stringify(quiz.sections || [])) : [],
  };
  renderQuizBuilder();
}

function renderQuizBuilder() {
  const qb = quizBuilderState;
  openModal(`
    <h2><i class="fas fa-tools"></i> ${qb.id ? 'Edit' : 'Build'} Quiz</h2>
    <div class="form-group"><label>Quiz Title *</label><input type="text" value="${escapeHtml(qb.title)}" oninput="quizBuilderState.title = this.value"></div>
    <div class="form-group"><label>Description</label><textarea oninput="quizBuilderState.description = this.value">${escapeHtml(qb.description)}</textarea></div>
    <div class="form-group"><label>Category</label><input type="text" value="${escapeHtml(qb.category)}" oninput="quizBuilderState.category = this.value"></div>
    <div class="form-group"><label>🎁 Reward Badge</label>
      <select onchange="quizBuilderState.rewardBadgeId = this.value ? parseInt(this.value) : null">
        <option value="">— No badge reward —</option>
        ${state.badges.map(b => `<option value="${b.id}" ${b.id === qb.rewardBadgeId ? 'selected' : ''}>${b.icon} ${escapeHtml(b.name)}</option>`).join('')}
      </select>
    </div>
    <div style="margin-top: 18px; margin-bottom: 10px;"><label style="margin: 0; font-size: 0.9rem;">Sections (${qb.sections.length})</label></div>
    <div>${qb.sections.map((s, i) => renderSectionBuilder(s, i, 'quiz')).join('')}</div>
    <div style="margin-top: 14px;">
      <label style="margin-bottom: 8px; font-size: 0.9rem;">Add Section:</label>
      <div class="assign-type-grid">
        ${state.sectionTypes.map(t => `<div class="assign-type-card" onclick="addQuizSection('${t.id}')"><div class="at-icon">${t.icon}</div><div class="at-name">${t.name}</div></div>`).join('')}
      </div>
    </div>
    <div class="actions">
      ${qb.id ? `<button class="btn btn-outline" onclick="deleteQuiz(${qb.id})" style="margin-right: auto; color: var(--danger); border-color: var(--danger);"><i class="fas fa-trash"></i> Delete</button>` : ''}
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveQuizFromBuilder()"><i class="fas fa-save"></i> Save Quiz</button>
    </div>
  `, 'xl');
}

function renderSectionBuilder(section, idx, context) {
  const typeInfo = state.sectionTypes.find(t => t.id === section.type) || { icon: '❓', name: 'Unknown' };
  const prefix = context === 'test' ? 'T' : '';
  let bodyHtml = '';
  if (['vocab-mc','fill-blank','en-es','es-en'].includes(section.type)) {
    bodyHtml = `
      ${(section.questions || []).map((q, qi) => `
        <div class="question-item">
          <div class="q-num">${qi + 1}</div>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 6px;">
            <input type="text" class="inline-edit" placeholder="Question" value="${escapeHtml(q.question || '')}" oninput="update${prefix}Question(${idx}, ${qi}, 'question', this.value)">
            <input type="text" class="inline-edit" placeholder="Correct answer" value="${escapeHtml(q.answer || '')}" oninput="update${prefix}Question(${idx}, ${qi}, 'answer', this.value)">
          </div>
          <button class="btn btn-outline btn-xs" onclick="remove${prefix}Question(${idx}, ${qi})" style="color: var(--danger);"><i class="fas fa-times"></i></button>
        </div>
      `).join('')}
      <button onclick="add${prefix}QuestionToSection(${idx})" style="margin-top: 8px; padding: 10px; border-radius: 10px; border: 2px dashed var(--border); background: transparent; color: var(--text-light); font-weight: 600; cursor: pointer; width: 100%; font-family: inherit;"><i class="fas fa-plus"></i> Add Question</button>
    `;
  } else if (section.type === 'matching') {
    bodyHtml = `
      ${(section.pairs || []).map((p, pi) => `
        <div class="question-item">
          <div class="q-num">${pi + 1}</div>
          <div style="flex: 1; display: flex; gap: 6px;">
            <input type="text" class="inline-edit" placeholder="Left" value="${escapeHtml(p.left || '')}" oninput="update${prefix}Match(${idx}, ${pi}, 'left', this.value)">
            <input type="text" class="inline-edit" placeholder="Right" value="${escapeHtml(p.right || '')}" oninput="update${prefix}Match(${idx}, ${pi}, 'right', this.value)">
          </div>
          <button class="btn btn-outline btn-xs" onclick="remove${prefix}Match(${idx}, ${pi})" style="color: var(--danger);"><i class="fas fa-times"></i></button>
        </div>
      `).join('')}
      <button onclick="add${prefix}Match(${idx})" style="margin-top: 8px; padding: 10px; border-radius: 10px; border: 2px dashed var(--border); background: transparent; color: var(--text-light); font-weight: 600; cursor: pointer; width: 100%; font-family: inherit;"><i class="fas fa-plus"></i> Add Pair</button>
    `;
  } else if (section.type === 'reading') {
    bodyHtml = `
      <div class="form-group"><label>Passage</label><textarea oninput="update${prefix}Reading(${idx}, 'passage', this.value)" style="min-height: 100px;">${escapeHtml(section.passage || '')}</textarea></div>
      ${(section.questions || []).map((q, qi) => `
        <div class="question-item">
          <div class="q-num">${qi + 1}</div>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 6px;">
            <input type="text" class="inline-edit" placeholder="Question" value="${escapeHtml(q.question || '')}" oninput="update${prefix}Question(${idx}, ${qi}, 'question', this.value)">
            <input type="text" class="inline-edit" placeholder="Correct answer" value="${escapeHtml(q.answer || '')}" oninput="update${prefix}Question(${idx}, ${qi}, 'answer', this.value)">
          </div>
          <button class="btn btn-outline btn-xs" onclick="remove${prefix}Question(${idx}, ${qi})" style="color: var(--danger);"><i class="fas fa-times"></i></button>
        </div>
      `).join('')}
      <button onclick="add${prefix}QuestionToSection(${idx})" style="margin-top: 8px; padding: 10px; border-radius: 10px; border: 2px dashed var(--border); background: transparent; color: var(--text-light); font-weight: 600; cursor: pointer; width: 100%; font-family: inherit;"><i class="fas fa-plus"></i> Add Question</button>
    `;
  } else if (section.type === 'speaking') {
    bodyHtml = `
      ${(section.prompts || []).map((p, pi) => `
        <div class="question-item">
          <div class="q-num">${pi + 1}</div>
          <input type="text" class="inline-edit" placeholder="Speaking prompt" value="${escapeHtml(p.text || p)}" oninput="update${prefix}Speaking(${idx}, ${pi}, this.value)" style="flex: 1;">
          <button class="btn btn-outline btn-xs" onclick="remove${prefix}Speaking(${idx}, ${pi})" style="color: var(--danger);"><i class="fas fa-times"></i></button>
        </div>
      `).join('')}
      <button onclick="add${prefix}Speaking(${idx})" style="margin-top: 8px; padding: 10px; border-radius: 10px; border: 2px dashed var(--border); background: transparent; color: var(--text-light); font-weight: 600; cursor: pointer; width: 100%; font-family: inherit;"><i class="fas fa-plus"></i> Add Prompt</button>
    `;
  } else if (section.type === 'writing') {
    bodyHtml = `<div class="form-group"><label>Writing Prompt</label><textarea oninput="update${prefix}Writing(${idx}, this.value)">${escapeHtml(section.prompt || '')}</textarea></div>`;
  }
  return `
    <div class="section-builder">
      <div class="section-builder-header">
        <span><span class="section-icon">${typeInfo.icon}</span>${typeInfo.name}</span>
        <div style="display: flex; gap: 6px;">
          <button class="btn btn-outline btn-xs" onclick="move${prefix}Section(${idx}, -1)"><i class="fas fa-arrow-up"></i></button>
          <button class="btn btn-outline btn-xs" onclick="move${prefix}Section(${idx}, 1)"><i class="fas fa-arrow-down"></i></button>
          <button class="btn btn-outline btn-xs" onclick="remove${prefix}Section(${idx})" style="color: var(--danger);"><i class="fas fa-trash"></i></button>
        </div>
      </div>
      <div class="section-builder-body">${bodyHtml}</div>
    </div>
  `;
}

function addQuizSection(typeId) {
  const newSection = { type: typeId };
  if (['vocab-mc','fill-blank','en-es','es-en','reading'].includes(typeId)) {
    newSection.questions = [];
    for (let i = 0; i < 5; i++) newSection.questions.push({ question: '', answer: '' });
  } else if (typeId === 'matching') {
    newSection.pairs = [];
    for (let i = 0; i < 5; i++) newSection.pairs.push({ left: '', right: '' });
  } else if (typeId === 'speaking') {
    newSection.prompts = [];
    for (let i = 0; i < 2; i++) newSection.prompts.push({ text: '' });
  } else if (typeId === 'writing') newSection.prompt = '';
  quizBuilderState.sections.push(newSection);
  renderQuizBuilder();
}
function removeSection(idx) { quizBuilderState.sections.splice(idx, 1); renderQuizBuilder(); }
function moveSection(idx, dir) {
  const n = idx + dir;
  if (n < 0 || n >= quizBuilderState.sections.length) return;
  [quizBuilderState.sections[idx], quizBuilderState.sections[n]] = [quizBuilderState.sections[n], quizBuilderState.sections[idx]];
  renderQuizBuilder();
}
function addQuestionToSection(idx) { const s = quizBuilderState.sections[idx]; if (!s.questions) s.questions = []; s.questions.push({ question: '', answer: '' }); renderQuizBuilder(); }
function removeQuestion(idx, qi) { quizBuilderState.sections[idx].questions.splice(qi, 1); renderQuizBuilder(); }
function updateQuestion(idx, qi, f, v) { const s = quizBuilderState.sections[idx]; if (s.questions && s.questions[qi]) s.questions[qi][f] = v; }
function addMatchPair(idx) { const s = quizBuilderState.sections[idx]; if (!s.pairs) s.pairs = []; s.pairs.push({ left: '', right: '' }); renderQuizBuilder(); }
function removeMatchPair(idx, pi) { quizBuilderState.sections[idx].pairs.splice(pi, 1); renderQuizBuilder(); }
function updateMatchPair(idx, pi, f, v) { const s = quizBuilderState.sections[idx]; if (s.pairs && s.pairs[pi]) s.pairs[pi][f] = v; }
function updateReading(idx, f, v) { quizBuilderState.sections[idx][f] = v; }
function addSpeakingPromptToSection(idx) { const s = quizBuilderState.sections[idx]; if (!s.prompts) s.prompts = []; s.prompts.push({ text: '' }); renderQuizBuilder(); }
function removeSpeakingPrompt(idx, pi) { quizBuilderState.sections[idx].prompts.splice(pi, 1); renderQuizBuilder(); }
function updateSpeakingPrompt(idx, pi, v) { const s = quizBuilderState.sections[idx]; if (s.prompts && s.prompts[pi]) s.prompts[pi].text = v; }
function updateWriting(idx, v) { quizBuilderState.sections[idx].prompt = v; }

function saveQuizFromBuilder() {
  const qb = quizBuilderState;
  if (!qb.title.trim()) { showToast("Quiz title is required", "warning"); return; }
  if (qb.sections.length === 0) { showToast("Add at least one section", "warning"); return; }
  const quizData = { title: qb.title.trim(), description: qb.description.trim(), category: qb.category.trim(), rewardBadgeId: qb.rewardBadgeId, sections: qb.sections };
  if (qb.id) {
    const existing = state.quizzes.find(q => q.id === qb.id);
    if (existing) Object.assign(existing, quizData);
  } else {
    const maxId = Math.max(0, ...state.quizzes.map(q => q.id));
    state.quizzes.push({ id: maxId + 1, ...quizData });
  }
  saveState();
  showToast("Quiz saved ✓", "success");
  closeModal();
  renderPage(currentPage);
}

function deleteQuiz(id) {
  confirmAction("Delete Quiz?", "This will permanently delete this quiz.", () => {
    state.quizzes = state.quizzes.filter(q => q.id !== id);
    saveState();
    showToast("Quiz deleted", "info");
    closeModal();
    renderPage(currentPage);
  });
}

function openQuizIntro(id) {
  const q = state.quizzes.find(x => x.id === id);
  if (!q) return;
  const attempts = state.quizAttempts[q.id]?.attempts || 0;
  if (attempts >= 3) { showToast("No attempts left for this quiz", "warning"); return; }
  const rewardBadge = q.rewardBadgeId ? state.badges.find(b => b.id === q.rewardBadgeId) : null;
  openModal(`
    <h2><i class="fas fa-question-circle"></i> ${escapeHtml(q.title)}</h2>
    <p style="font-size: 0.9rem; color: var(--text-light); margin-bottom: 18px;">${escapeHtml(q.description || '')}</p>
    ${rewardBadge ? `<div class="reward-banner"><div class="reward-icon">${rewardBadge.icon}</div><div class="reward-text"><strong>Complete to earn this badge!</strong>${escapeHtml(rewardBadge.name)}</div></div>` : ''}
    <div class="card" style="background: var(--bg); margin-bottom: 18px;">
      <div style="font-size: 0.85rem;"><i class="fas fa-redo" style="color: var(--primary); width: 22px;"></i> Attempts used: ${attempts}/3</div>
    </div>
    <div class="actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="startQuiz(${q.id})"><i class="fas fa-play"></i> Begin Quiz</button>
    </div>
  `, 'lg');
}

function startQuiz(id) {
  const q = state.quizzes.find(x => x.id === id);
  if (!q) return;
  closeModal();
  let html = `<h2><i class="fas fa-question-circle"></i> ${escapeHtml(q.title)}</h2>`;
  let qCounter = 0;
  (q.sections || []).forEach((s) => {
    const typeInfo = state.sectionTypes.find(t => t.id === s.type) || { icon: '❓' };
    html += `<div style="margin: 16px 0 10px; padding: 8px 14px; background: var(--primary-light); border-radius: 10px; font-weight: 700; font-size: 0.85rem;">${typeInfo.icon} ${typeInfo.name}</div>`;
    if (['vocab-mc','fill-blank','en-es','es-en','reading'].includes(s.type)) {
      if (s.type === 'reading') html += `<div style="background: var(--bg); border-radius: 12px; padding: 18px; margin-bottom: 12px; font-size: 0.9rem; line-height: 1.7; white-space: pre-wrap;">${escapeHtml(s.passage || '')}</div>`;
      (s.questions || []).forEach((qq) => {
        qCounter++;
        html += `<div style="padding: 14px; background: var(--bg); border-radius: 12px; margin-bottom: 10px;">
          <p style="font-weight: 600; margin-bottom: 8px;">${qCounter}. ${escapeHtml(qq.question || '')}</p>
          <input type="text" placeholder="Your answer..." data-q-idx="${qCounter - 1}" class="quiz-answer-input" style="width: 100%; padding: 11px 14px; border-radius: 11px; border: 1.5px solid var(--border); background: var(--card-bg); color: var(--text); font-family: inherit;">
        </div>`;
      });
    } else if (s.type === 'matching') {
      (s.pairs || []).forEach((p) => {
        qCounter++;
        html += `<div style="padding: 14px; background: var(--bg); border-radius: 12px; margin-bottom: 10px;">
          <p style="font-weight: 600; margin-bottom: 8px;">${qCounter}. Match: <strong>${escapeHtml(p.left || '')}</strong></p>
          <input type="text" placeholder="Match with..." data-q-idx="${qCounter - 1}" class="quiz-answer-input" style="width: 100%; padding: 11px 14px; border-radius: 11px; border: 1.5px solid var(--border); background: var(--card-bg); color: var(--text);">
        </div>`;
      });
    } else if (s.type === 'speaking') {
      (s.prompts || []).forEach((p) => {
        qCounter++;
        html += `<div style="padding: 14px; background: var(--bg); border-radius: 12px; margin-bottom: 10px;">
          <p style="font-weight: 600; margin-bottom: 8px;">${qCounter}. 🎤 ${escapeHtml(p.text || '')}</p>
          <button class="btn btn-outline btn-sm" onclick="showToast('🎤 Recording...', 'info')"><i class="fas fa-microphone"></i> Record</button>
        </div>`;
      });
    } else if (s.type === 'writing') {
      qCounter++;
      html += `<div style="padding: 14px; background: var(--bg); border-radius: 12px; margin-bottom: 10px;">
        <p style="font-weight: 600; margin-bottom: 8px;">${qCounter}. ✍️ ${escapeHtml(s.prompt || '')}</p>
        <textarea placeholder="Write your response..." data-q-idx="${qCounter - 1}" class="quiz-answer-input" style="width: 100%; min-height: 100px; padding: 11px 14px; border-radius: 11px; border: 1.5px solid var(--border); background: var(--card-bg); color: var(--text); font-family: inherit;"></textarea>
      </div>`;
    }
  });
  html += `<div class="actions"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="submitQuizAttempt(${q.id})"><i class="fas fa-check"></i> Submit</button></div>`;
  openModal(html, 'xl');
}

function submitQuizAttempt(id) {
  const q = state.quizzes.find(x => x.id === id);
  if (!q) return;
  let correct = 0, total = 0;
  const inputs = document.querySelectorAll('.quiz-answer-input');
  let qIdx = 0;
  (q.sections || []).forEach(s => {
    if (['vocab-mc','fill-blank','en-es','es-en','reading'].includes(s.type)) {
      (s.questions || []).forEach(qq => {
        const input = inputs[qIdx];
        if (input && input.value.trim().toLowerCase() === (qq.answer || '').trim().toLowerCase()) correct++;
        total++; qIdx++;
      });
    } else if (s.type === 'matching') {
      (s.pairs || []).forEach(p => {
        const input = inputs[qIdx];
        if (input && input.value.trim().toLowerCase() === (p.right || '').trim().toLowerCase()) correct++;
        total++; qIdx++;
      });
    } else if (s.type === 'speaking' || s.type === 'writing') {
      const count = s.type === 'speaking' ? (s.prompts?.length || 0) : 1;
      for (let i = 0; i < count; i++) { total++; qIdx++; }
    }
  });
  const score = total > 0 ? Math.round((correct / total) * 100) : 0;
  if (!state.quizAttempts[id]) state.quizAttempts[id] = { attempts: 0, scores: [] };
  state.quizAttempts[id].attempts++;
  state.quizAttempts[id].scores.push(score);
  if (q.rewardBadgeId && score >= 70) {
    const badge = state.badges.find(b => b.id === q.rewardBadgeId);
    if (badge && !badge.earned) { badge.earned = true; showToast(`🎉 Badge earned: ${badge.icon} ${badge.name}!`, "success"); }
  }
  saveState();
  showToast(`Quiz submitted! Score: ${score}%`, score >= 70 ? "success" : "warning");
  addXP(score >= 70 ? 50 : 20, "for taking a quiz!");
  closeModal();
  renderPage(currentPage);
}

/* ============================================================
   TESTS
   ============================================================ */
function renderTests() {
  const upcoming = state.tests.filter(t => (state.testAttempts[t.id]?.attempts || 0) < 1);
  const completed = state.tests.filter(t => (state.testAttempts[t.id]?.attempts || 0) >= 1);
  return `
    <div class="section-header">
      <div><h2>Tests</h2><p class="subtitle">Major assessments · 1 attempt only</p></div>
      ${teacherMode ? `<button class="btn btn-primary btn-sm" onclick="openTestBuilder()"><i class="fas fa-plus"></i> Build Test</button>` : `<span class="lock-notice"><i class="fas fa-lock"></i> Teacher creates tests</span>`}
    </div>
    ${upcoming.length > 0 ? `
      <div class="two-col" style="margin-bottom: 28px;">
        ${upcoming.map(t => {
          const rewardBadge = t.rewardBadgeId ? state.badges.find(b => b.id === t.rewardBadgeId) : null;
          return `
            <div class="card">
              ${rewardBadge ? `<div style="display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--secondary-light); border-radius: 10px; margin-bottom: 12px; font-size: 0.75rem; font-weight: 700; color: #C48A1A;">
                <span style="font-size: 1.2rem;">${rewardBadge.icon}</span> Earns: ${escapeHtml(rewardBadge.name)}
              </div>` : ''}
              <h3 style="font-size: 1.05rem; font-weight: 700; margin-bottom: 8px;">${escapeHtml(t.title)}</h3>
              <p style="font-size: 0.82rem; color: var(--text-light); margin-bottom: 14px;">${escapeHtml(t.description || '')} ${t.date ? '· ' + t.date : ''}</p>
              <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                <button class="btn btn-primary btn-sm" onclick="openTestIntro(${t.id})"><i class="fas fa-play"></i> Take Test</button>
                ${teacherMode ? `
                  <button class="btn btn-outline btn-sm" onclick="openTestBuilder(${t.id})"><i class="fas fa-edit"></i></button>
                  <button class="btn btn-outline btn-sm" onclick="deleteTest(${t.id})"><i class="fas fa-trash"></i></button>
                ` : ''}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    ` : ''}
    ${completed.length > 0 ? `
      <div class="two-col">
        ${completed.map(t => {
          const score = state.testAttempts[t.id]?.scores?.[0] || 0;
          return `
            <div class="card" style="opacity: 0.85;">
              <h3 style="font-size: 1.05rem; font-weight: 700; margin-bottom: 8px;">${escapeHtml(t.title)}</h3>
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 1.4rem; font-weight: 800; color: ${score >= 70 ? 'var(--success)' : 'var(--warning)'};">${score}%</span>
                ${teacherMode ? `<button class="btn btn-outline btn-sm" onclick="deleteTest(${t.id})"><i class="fas fa-trash"></i></button>` : ''}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    ` : ''}
    ${state.tests.length === 0 ? `<div class="card"><div class="empty-state"><i class="fas fa-file-alt"></i><p>No tests yet. ${teacherMode ? 'Click "Build Test" to create one.' : 'Your teacher will add tests soon.'}</p></div></div>` : ''}
  `;
}

let testBuilderState = { sections: [] };
function openTestBuilder(editId = null) {
  let test = editId ? state.tests.find(t => t.id === editId) : null;
  testBuilderState = {
    id: test ? test.id : null, title: test ? test.title : '', description: test ? test.description : '',
    date: test ? test.date : new Date(Date.now() + 14*86400000).toISOString().slice(0,10),
    duration: test ? test.duration : '45 min',
    rewardBadgeId: test ? test.rewardBadgeId : null,
    sections: test ? JSON.parse(JSON.stringify(test.sections || [])) : [],
  };
  renderTestBuilder();
}

function renderTestBuilder() {
  const tb = testBuilderState;
  openModal(`
    <h2><i class="fas fa-tools"></i> ${tb.id ? 'Edit' : 'Build'} Test</h2>
    <div class="form-group"><label>Test Title *</label><input type="text" value="${escapeHtml(tb.title)}" oninput="testBuilderState.title = this.value"></div>
    <div class="form-group"><label>Description</label><textarea oninput="testBuilderState.description = this.value">${escapeHtml(tb.description)}</textarea></div>
    <div class="form-group"><label>Date</label><input type="date" value="${tb.date}" oninput="testBuilderState.date = this.value"></div>
    <div class="form-group"><label>Duration</label><input type="text" value="${escapeHtml(tb.duration)}" oninput="testBuilderState.duration = this.value"></div>
    <div class="form-group"><label>🎁 Reward Badge</label>
      <select onchange="testBuilderState.rewardBadgeId = this.value ? parseInt(this.value) : null">
        <option value="">— No badge reward —</option>
        ${state.badges.map(b => `<option value="${b.id}" ${b.id === tb.rewardBadgeId ? 'selected' : ''}>${b.icon} ${escapeHtml(b.name)}</option>`).join('')}
      </select>
    </div>
    <div style="margin: 18px 0 10px;"><label style="margin: 0; font-size: 0.9rem;">Sections (${tb.sections.length})</label></div>
    <div>${tb.sections.map((s, i) => renderSectionBuilder(s, i, 'test')).join('')}</div>
    <div style="margin-top: 14px;">
      <label style="margin-bottom: 8px; font-size: 0.9rem;">Add Section:</label>
      <div class="assign-type-grid">
        ${state.sectionTypes.map(t => `<div class="assign-type-card" onclick="addTestSection('${t.id}')"><div class="at-icon">${t.icon}</div><div class="at-name">${t.name}</div></div>`).join('')}
      </div>
    </div>
    <div class="actions">
      ${tb.id ? `<button class="btn btn-outline" onclick="deleteTest(${tb.id})" style="margin-right: auto; color: var(--danger); border-color: var(--danger);"><i class="fas fa-trash"></i> Delete</button>` : ''}
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveTestFromBuilder()"><i class="fas fa-save"></i> Save Test</button>
    </div>
  `, 'xl');
}

function addTestSection(typeId) {
  const newSection = { type: typeId };
  if (['vocab-mc','fill-blank','en-es','es-en','reading'].includes(typeId)) {
    newSection.questions = [];
    for (let i = 0; i < 5; i++) newSection.questions.push({ question: '', answer: '' });
  } else if (typeId === 'matching') {
    newSection.pairs = [];
    for (let i = 0; i < 5; i++) newSection.pairs.push({ left: '', right: '' });
  } else if (typeId === 'speaking') {
    newSection.prompts = [];
    for (let i = 0; i < 2; i++) newSection.prompts.push({ text: '' });
  } else if (typeId === 'writing') newSection.prompt = '';
  testBuilderState.sections.push(newSection);
  renderTestBuilder();
}

function removeTSection(idx) { testBuilderState.sections.splice(idx, 1); renderTestBuilder(); }
function moveTSection(idx, dir) {
  const n = idx + dir;
  if (n < 0 || n >= testBuilderState.sections.length) return;
  [testBuilderState.sections[idx], testBuilderState.sections[n]] = [testBuilderState.sections[n], testBuilderState.sections[idx]];
  renderTestBuilder();
}
function addTQuestionToSection(idx) { const s = testBuilderState.sections[idx]; if (!s.questions) s.questions = []; s.questions.push({ question: '', answer: '' }); renderTestBuilder(); }
function removeTQuestion(idx, qi) { testBuilderState.sections[idx].questions.splice(qi, 1); renderTestBuilder(); }
function updateTQuestion(idx, qi, f, v) { const s = testBuilderState.sections[idx]; if (s.questions && s.questions[qi]) s.questions[qi][f] = v; }
function addTMatch(idx) { const s = testBuilderState.sections[idx]; if (!s.pairs) s.pairs = []; s.pairs.push({ left: '', right: '' }); renderTestBuilder(); }
function removeTMatch(idx, pi) { testBuilderState.sections[idx].pairs.splice(pi, 1); renderTestBuilder(); }
function updateTMatch(idx, pi, f, v) { const s = testBuilderState.sections[idx]; if (s.pairs && s.pairs[pi]) s.pairs[pi][f] = v; }
function updateTReading(idx, f, v) { testBuilderState.sections[idx][f] = v; }
function addTSpeaking(idx) { const s = testBuilderState.sections[idx]; if (!s.prompts) s.prompts = []; s.prompts.push({ text: '' }); renderTestBuilder(); }
function removeTSpeaking(idx, pi) { testBuilderState.sections[idx].prompts.splice(pi, 1); renderTestBuilder(); }
function updateTSpeaking(idx, pi, v) { const s = testBuilderState.sections[idx]; if (s.prompts && s.prompts[pi]) s.prompts[pi].text = v; }
function updateTWriting(idx, v) { testBuilderState.sections[idx].prompt = v; }

function saveTestFromBuilder() {
  const tb = testBuilderState;
  if (!tb.title.trim()) { showToast("Test title is required", "warning"); return; }
  if (tb.sections.length === 0) { showToast("Add at least one section", "warning"); return; }
  const testData = { title: tb.title.trim(), description: tb.description.trim(), date: tb.date, duration: tb.duration, rewardBadgeId: tb.rewardBadgeId, sections: tb.sections };
  if (tb.id) {
    const existing = state.tests.find(t => t.id === tb.id);
    if (existing) Object.assign(existing, testData);
  } else {
    const maxId = Math.max(0, ...state.tests.map(t => t.id));
    state.tests.push({ id: maxId + 1, ...testData });
  }
  saveState();
  showToast("Test saved ✓", "success");
  closeModal();
  renderPage(currentPage);
}

function deleteTest(id) {
  confirmAction("Delete Test?", "This will permanently delete this test.", () => {
    state.tests = state.tests.filter(t => t.id !== id);
    saveState();
    showToast("Test deleted", "info");
    closeModal();
    renderPage(currentPage);
  });
}

function openTestIntro(id) {
  const t = state.tests.find(x => x.id === id);
  if (!t) return;
  const attempts = state.testAttempts[t.id]?.attempts || 0;
  if (attempts >= 1) { showToast("Test already taken — only 1 attempt allowed", "warning"); return; }
  const rewardBadge = t.rewardBadgeId ? state.badges.find(b => b.id === t.rewardBadgeId) : null;
  openModal(`
    <h2><i class="fas fa-file-alt"></i> ${escapeHtml(t.title)}</h2>
    <p style="font-size: 0.9rem; color: var(--text-light); margin-bottom: 18px;">${escapeHtml(t.description || '')}</p>
    ${rewardBadge ? `<div class="reward-banner"><div class="reward-icon">${rewardBadge.icon}</div><div class="reward-text"><strong>Complete to earn this badge!</strong>${escapeHtml(rewardBadge.name)}</div></div>` : ''}
    <div class="card" style="background: var(--bg); margin-bottom: 18px;">
      <div style="font-size: 0.85rem;"><i class="fas fa-exclamation-triangle" style="color: var(--warning);"></i> <strong>Only 1 attempt allowed</strong></div>
    </div>
    <div class="actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="startTest(${t.id})"><i class="fas fa-play"></i> Begin Test</button>
    </div>
  `, 'lg');
}

function startTest(id) {
  const t = state.tests.find(x => x.id === id);
  if (!t) return;
  closeModal();
  let html = `<h2><i class="fas fa-file-alt"></i> ${escapeHtml(t.title)}</h2>`;
  let qCounter = 0;
  (t.sections || []).forEach((s) => {
    const typeInfo = state.sectionTypes.find(x => x.id === s.type) || { icon: '❓' };
    html += `<div style="margin: 16px 0 10px; padding: 8px 14px; background: var(--primary-light); border-radius: 10px; font-weight: 700; font-size: 0.85rem;">${typeInfo.icon} ${typeInfo.name}</div>`;
    if (['vocab-mc','fill-blank','en-es','es-en','reading'].includes(s.type)) {
      if (s.type === 'reading') html += `<div style="background: var(--bg); border-radius: 12px; padding: 18px; margin-bottom: 12px; font-size: 0.9rem; line-height: 1.7; white-space: pre-wrap;">${escapeHtml(s.passage || '')}</div>`;
      (s.questions || []).forEach((qq) => {
        qCounter++;
        html += `<div style="padding: 14px; background: var(--bg); border-radius: 12px; margin-bottom: 10px;">
          <p style="font-weight: 600; margin-bottom: 8px;">${qCounter}. ${escapeHtml(qq.question || '')}</p>
          <input type="text" placeholder="Your answer..." data-q-idx="${qCounter - 1}" class="quiz-answer-input" style="width: 100%; padding: 11px 14px; border-radius: 11px; border: 1.5px solid var(--border); background: var(--card-bg); color: var(--text);">
        </div>`;
      });
    } else if (s.type === 'matching') {
      (s.pairs || []).forEach((p) => {
        qCounter++;
        html += `<div style="padding: 14px; background: var(--bg); border-radius: 12px; margin-bottom: 10px;">
          <p style="font-weight: 600; margin-bottom: 8px;">${qCounter}. Match: <strong>${escapeHtml(p.left || '')}</strong></p>
          <input type="text" placeholder="Match with..." data-q-idx="${qCounter - 1}" class="quiz-answer-input" style="width: 100%; padding: 11px 14px; border-radius: 11px; border: 1.5px solid var(--border); background: var(--card-bg); color: var(--text);">
        </div>`;
      });
    } else if (s.type === 'speaking') {
      (s.prompts || []).forEach((p) => {
        qCounter++;
        html += `<div style="padding: 14px; background: var(--bg); border-radius: 12px; margin-bottom: 10px;">
          <p style="font-weight: 600; margin-bottom: 8px;">${qCounter}. 🎤 ${escapeHtml(p.text || '')}</p>
          <button class="btn btn-outline btn-sm" onclick="showToast('🎤 Recording...', 'info')"><i class="fas fa-microphone"></i> Record</button>
        </div>`;
      });
    } else if (s.type === 'writing') {
      qCounter++;
      html += `<div style="padding: 14px; background: var(--bg); border-radius: 12px; margin-bottom: 10px;">
        <p style="font-weight: 600; margin-bottom: 8px;">${qCounter}. ✍️ ${escapeHtml(s.prompt || '')}</p>
        <textarea placeholder="Write your response..." data-q-idx="${qCounter - 1}" class="quiz-answer-input" style="width: 100%; min-height: 100px; padding: 11px 14px; border-radius: 11px; border: 1.5px solid var(--border); background: var(--card-bg); color: var(--text); font-family: inherit;"></textarea>
      </div>`;
    }
  });
  html += `<div class="actions"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="submitTestAttempt(${t.id})"><i class="fas fa-check"></i> Submit</button></div>`;
  openModal(html, 'xl');
}

function submitTestAttempt(id) {
  const t = state.tests.find(x => x.id === id);
  if (!t) return;
  let correct = 0, total = 0;
  const inputs = document.querySelectorAll('.quiz-answer-input');
  let qIdx = 0;
  (t.sections || []).forEach(s => {
    if (['vocab-mc','fill-blank','en-es','es-en','reading'].includes(s.type)) {
      (s.questions || []).forEach(qq => {
        const input = inputs[qIdx];
        if (input && input.value.trim().toLowerCase() === (qq.answer || '').trim().toLowerCase()) correct++;
        total++; qIdx++;
      });
    } else if (s.type === 'matching') {
      (s.pairs || []).forEach(p => {
        const input = inputs[qIdx];
        if (input && input.value.trim().toLowerCase() === (p.right || '').trim().toLowerCase()) correct++;
        total++; qIdx++;
      });
    } else if (s.type === 'speaking' || s.type === 'writing') {
      const count = s.type === 'speaking' ? (s.prompts?.length || 0) : 1;
      for (let i = 0; i < count; i++) { total++; qIdx++; }
    }
  });
  const score = total > 0 ? Math.round((correct / total) * 100) : 0;
  if (!state.testAttempts[id]) state.testAttempts[id] = { attempts: 0, scores: [] };
  state.testAttempts[id].attempts = 1;
  state.testAttempts[id].scores.push(score);
  if (t.rewardBadgeId && score >= 70) {
    const badge = state.badges.find(b => b.id === t.rewardBadgeId);
    if (badge && !badge.earned) { badge.earned = true; showToast(`🎉 Badge earned: ${badge.icon} ${badge.name}!`, "success"); }
  }
  saveState();
  showToast(`Test submitted! Score: ${score}%`, score >= 70 ? "success" : "warning");
  addXP(score >= 70 ? 100 : 30, "for taking a test!");
  closeModal();
  renderPage(currentPage);
}

/* ============================================================
   GRADES
   ============================================================ */
function renderGrades() {
  const overall = computeOverallGrade();
  const assignmentsAvg = computeCategoryAverage('Assignments');
  const quizzesAvg = computeCategoryAverage('Quizzes');
  const testsAvg = computeCategoryAverage('Tests');
  const upcomingAssignments = state.assignments.filter(a => a.status !== 'Graded');
  const upcomingQuizzes = state.quizzes.filter(q => (state.quizAttempts[q.id]?.attempts || 0) === 0);
  const upcomingTests = state.tests.filter(t => (state.testAttempts[t.id]?.attempts || 0) === 0);
  const pastAssignments = state.assignments.filter(a => a.status === 'Graded');
  const pastQuizzes = state.quizzes.filter(q => (state.quizAttempts[q.id]?.attempts || 0) > 0);
  const pastTests = state.tests.filter(t => (state.testAttempts[t.id]?.attempts || 0) > 0);

  return `
    <div class="section-header"><div><h2>Gradebook</h2><p class="subtitle">Everything connected — grades update automatically</p></div></div>

      <div class="gs-left">
        <div class="gs-label">Overall Grade</div>
        <div class="gs-value">${overall}%</div>
        <div class="gs-sub">${pastAssignments.length + pastQuizzes.length + pastTests.length} graded items</div>
      </div>
      <div style="display: flex; gap: 20px; flex-wrap: wrap; position: relative;">
        <div><div class="gs-label">Assignments</div><div style="font-size: 1.6rem; font-weight: 800;">${assignmentsAvg}%</div></div>
        <div><div class="gs-label">Quizzes</div><div style="font-size: 1.6rem; font-weight: 800;">${quizzesAvg}%</div></div>
        <div><div class="gs-label">Tests</div><div style="font-size: 1.6rem; font-weight: 800;">${testsAvg}%</div></div>
      </div>
    </div>
    ${(upcomingAssignments.length + upcomingQuizzes.length + upcomingTests.length) > 0 ? `
      <div class="section-header" style="margin-bottom: 14px;"><h3 style="font-size: 1.05rem; font-weight: 800;"><i class="fas fa-clock" style="color: var(--primary); margin-right: 8px;"></i>Upcoming</h3></div>
      ${upcomingAssignments.map(a => {
        const icon = getAssignmentIcon(a.category);
        return `<div class="grade-item-card" onclick="openAssignment(${a.id})">
          <div class="gi-left"><div class="gi-icon" style="background: ${icon.bg}; color: ${icon.color};"><i class="fas ${icon.fa}"></i></div>
          <div class="gi-info"><div class="gi-title">${escapeHtml(a.title)}</div><div class="gi-meta"><span class="grade-badge" style="background: var(--primary-light); color: var(--primary);">Assignment</span><span>Due ${a.due}</span></div></div></div>
          <span class="status-badge status-${a.status.toLowerCase().replace(/\s+/g, '-')}">${a.status}</span>
        </div>`;
      }).join('')}
      ${upcomingQuizzes.map(q => `<div class="grade-item-card" onclick="openQuizIntro(${q.id})">
        <div class="gi-left"><div class="gi-icon" style="background: var(--info-light); color: var(--info);"><i class="fas fa-question-circle"></i></div>
        <div class="gi-info"><div class="gi-title">${escapeHtml(q.title)}</div><div class="gi-meta"><span class="grade-badge" style="background: var(--info-light); color: var(--info);">Quiz</span><span>3 attempts</span></div></div></div>
        <span class="status-badge status-upcoming">Not Started</span>
      </div>`).join('')}
      ${upcomingTests.map(t => `<div class="grade-item-card" onclick="openTestIntro(${t.id})">
        <div class="gi-left"><div class="gi-icon" style="background: var(--secondary-light); color: #C48A1A;"><i class="fas fa-file-alt"></i></div>
        <div class="gi-info"><div class="gi-title">${escapeHtml(t.title)}</div><div class="gi-meta"><span class="grade-badge" style="background: var(--secondary-light); color: #C48A1A;">Test</span><span>1 attempt</span></div></div></div>
        <span class="status-badge status-upcoming">Not Started</span>
      </div>`).join('')}
    ` : ''}
    ${(pastAssignments.length + pastQuizzes.length + pastTests.length) > 0 ? `
      <div class="section-header" style="margin: 28px 0 14px;"><h3 style="font-size: 1.05rem; font-weight: 800;"><i class="fas fa-check-circle" style="color: var(--success); margin-right: 8px;"></i>Completed & Graded</h3></div>
      ${pastAssignments.map(a => {
        const icon = getAssignmentIcon(a.category);
        const pct = a.score !== null ? Math.round((a.score / a.points) * 100) : null;
        return `<div class="grade-item-card" onclick="openAssignment(${a.id})">
          <div class="gi-left"><div class="gi-icon" style="background: ${icon.bg}; color: ${icon.color};"><i class="fas ${icon.fa}"></i></div>
          <div class="gi-info"><div class="gi-title">${escapeHtml(a.title)}</div><div class="gi-meta"><span class="grade-badge" style="background: var(--primary-light); color: var(--primary);">Assignment</span></div></div></div>
          <div class="gi-score"><div class="gi-score-value">${pct !== null ? `<span class="grade-badge ${pct >= 90 ? 'a' : pct >= 80 ? 'b' : pct >= 70 ? 'c' : 'd'}">${pct}%</span>` : '—'}</div><div class="gi-score-sub">${a.score}/${a.points}</div></div>
        </div>`;
      }).join('')}
      ${pastQuizzes.map(q => {
        const attempts = state.quizAttempts[q.id]?.attempts || 0;
        const scores = state.quizAttempts[q.id]?.scores || [];
        const best = scores.length > 0 ? Math.max(...scores) : 0;
        return `<div class="grade-item-card" onclick="openQuizIntro(${q.id})">
          <div class="gi-left"><div class="gi-icon" style="background: var(--info-light); color: var(--info);"><i class="fas fa-question-circle"></i></div>
          <div class="gi-info"><div class="gi-title">${escapeHtml(q.title)}</div><div class="gi-meta"><span class="grade-badge" style="background: var(--info-light); color: var(--info);">Quiz</span><span>${attempts}/3 attempts</span></div></div></div>
          <div class="gi-score"><div class="gi-score-value"><span class="grade-badge ${best >= 90 ? 'a' : best >= 80 ? 'b' : best >= 70 ? 'c' : 'd'}">${best}%</span></div><div class="gi-score-sub">Best</div></div>
        </div>`;
      }).join('')}
      ${pastTests.map(t => {
        const score = state.testAttempts[t.id]?.scores?.[0] || 0;
        return `<div class="grade-item-card" onclick="openTestIntro(${t.id})">
          <div class="gi-left"><div class="gi-icon" style="background: var(--secondary-light); color: #C48A1A;"><i class="fas fa-file-alt"></i></div>
          <div class="gi-info"><div class="gi-title">${escapeHtml(t.title)}</div><div class="gi-meta"><span class="grade-badge" style="background: var(--secondary-light); color: #C48A1A;">Test</span></div></div></div>
          <div class="gi-score"><div class="gi-score-value"><span class="grade-badge ${score >= 90 ? 'a' : score >= 80 ? 'b' : score >= 70 ? 'c' : 'd'}">${score}%</span></div><div class="gi-score-sub">Final</div></div>
        </div>`;
      }).join('')}
    ` : ''}
    ${(state.assignments.length + state.quizzes.length + state.tests.length) === 0 ? `<div class="card"><div class="empty-state"><i class="fas fa-chart-bar"></i><p>No graded items yet.</p></div></div>` : ''}
  `;
}

/* ============================================================
   BADGES / MESSAGES / PROFILE
   ============================================================ */
function renderBadges() {
  return `
    <div class="section-header">
      <div><h2>Badges & Achievements</h2><p class="subtitle">${state.badges.filter(b => b.earned).length} of ${state.badges.length} earned</p></div>
      ${teacherMode ? `<button class="btn btn-primary btn-sm" onclick="addBadge()"><i class="fas fa-plus"></i> Create Badge</button>` : ''}
    </div>
    <div class="badges-grid">
      ${state.badges.map(b => `
        <div class="badge-item ${b.earned ? '' : 'locked'}" style="position: relative;">
          ${teacherMode ? `<div style="position: absolute; top: 6px; right: 6px; display: flex; gap: 3px;">
            <button class="btn btn-outline btn-xs" onclick="toggleBadgeEarned(${b.id})"><i class="fas fa-${b.earned ? 'times' : 'check'}"></i></button>
            <button class="btn btn-outline btn-xs" onclick="deleteBadge(${b.id})"><i class="fas fa-trash"></i></button>
          </div>` : ''}
          <div class="badge-icon">${b.icon}</div>
          <div class="badge-name">${escapeHtml(b.name)}</div>
          ${b.description ? `<div style="font-size: 0.62rem; color: var(--text-light); text-align: center; font-weight: 500;">${escapeHtml(b.description)}</div>` : ''}
          ${b.earned ? '<span style="font-size: 0.58rem; color: var(--success); font-weight: 800; margin-top: 3px;">EARNED</span>' : ''}
        </div>
      `).join('')}
    </div>
  `;
}
function addBadge() {
  openModal(`
    <h2><i class="fas fa-medal"></i> Create Badge</h2>
    <div class="form-group"><label>Badge Name *</label><input type="text" id="badgeName"></div>
    <div class="form-group"><label>Icon (emoji) *</label><input type="text" id="badgeIcon" value="🏆" maxlength="4"></div>
    <div class="form-group"><label>Description</label><input type="text" id="badgeDesc"></div>
    <div class="actions"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveNewBadge()"><i class="fas fa-plus"></i> Create</button></div>
  `);
}
function saveNewBadge() {
  const name = document.getElementById('badgeName').value.trim();
  if (!name) { showToast("Name is required", "warning"); return; }
  const maxId = Math.max(0, ...state.badges.map(b => b.id));
  state.badges.push({ id: maxId + 1, name, icon: document.getElementById('badgeIcon').value || '🏆', description: document.getElementById('badgeDesc').value.trim(), earned: false });
  saveState();
  showToast("Badge created ✓", "success");
  closeModal();
  renderPage(currentPage);
}
function toggleBadgeEarned(id) {
  const b = state.badges.find(x => x.id === id);
  if (b) { b.earned = !b.earned; saveState(); showToast(b.earned ? "Badge earned! 🎉" : "Marked unearned", b.earned ? "success" : "info"); renderPage(currentPage); }
}
function deleteBadge(id) {
  confirmAction("Delete Badge?", "This will remove this badge.", () => {
    state.badges = state.badges.filter(b => b.id !== id);
    saveState();
    showToast("Badge deleted", "info");
    closeModal();
    renderPage(currentPage);
  });
}

function renderMessages() {
  return `
    <div class="section-header"><div><h2>Messages</h2><p class="subtitle">${state.messages.length} messages</p></div></div>
    <div class="card">
      <div style="display: flex; flex-direction: column; gap: 14px; max-height: 400px; overflow-y: auto; padding-right: 8px;">
        ${state.messages.length === 0 ? '<div class="empty-state"><i class="fas fa-comment"></i><p>No messages yet</p></div>' : state.messages.map(m => `
          <div style="display: flex; gap: 12px; ${m.from === 'You' ? 'flex-direction: row-reverse;' : ''}">
            <div style="width: 36px; height: 36px; border-radius: 50%; background: ${m.from === 'You' ? 'var(--primary)' : 'var(--secondary)'}; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 0.78rem; flex-shrink: 0;">${m.from === 'You' ? 'Y' : 'T'}</div>
            <div style="max-width: 70%; ${m.from === 'You' ? 'text-align: right;' : ''}">
              <div style="background: ${m.from === 'You' ? 'var(--primary-light)' : 'var(--bg)'}; padding: 11px 15px; border-radius: 14px; border: 1px solid var(--border-light);"><p style="font-size: 0.875rem; font-weight: 500;">${escapeHtml(m.text)}</p></div>
              <div style="font-size: 0.68rem; color: var(--text-light); margin-top: 4px; font-weight: 600;">${escapeHtml(m.from)} · ${m.time}</div>

      <div style="display: flex; gap: 10px; margin-top: 16px; border-top: 1px solid var(--border-light); padding-top: 16px;">
        <input type="text" id="messageInput" placeholder="Type a message..." style="flex: 1; padding: 11px 15px; border-radius: 11px; border: 1.5px solid var(--border); background: var(--bg); color: var(--text); font-family: inherit; font-weight: 500;" onkeydown="if(event.key==='Enter') sendMessage()">
        <button class="btn btn-primary" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>

function sendMessage() {
  const input = document.getElementById('messageInput');
  const text = input?.value.trim();
  if (!text) return;
  state.messages.push({ id: Date.now(), from: teacherMode ? 'Teacher' : 'You', text, time: 'Just now', read: false });
  saveState();
  input.value = '';
  showToast("Message sent ✓", "success");
  renderPage(currentPage);
}

        <div style="flex: 1;">
          <h2 style="font-size: 1.5rem; font-weight: 800;">${escapeHtml(s.name)}</h2>
          <p style="color: var(--text-light); font-size: 0.9rem; font-weight: 500; margin-top: 4px;">Level ${s.level} · Week ${globalWeek} of 52</p>
          <div style="display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap;">

            <div class="badge-item" style="min-width: 78px; padding: 12px;">

function editStudentProfile() {
  const s = state.student;
  openModal(`
    <h2><i class="fas fa-user-edit"></i> Edit Profile</h2>
    <div class="form-group"><label>Name</label><input type="text" id="editStudentName" value="${escapeHtml(s.name)}"></div>
    <div class="form-group"><label>Avatar (1-2 chars)</label><input type="text" id="editStudentAvatar" value="${escapeHtml(s.avatar)}" maxlength="2"></div>
    <div class="form-group"><label>Level</label><select id="editStudentLevel">${state.levels.map(l => `<option value="${l.id}" ${l.id === s.level ? 'selected' : ''}>Level ${l.id} — ${l.name}</option>`).join('')}</select></div>
    <div class="form-group"><label>Week</label><input type="number" id="editStudentWeek" value="${s.week}" min="1"></div>
    <div class="form-group"><label>Milestone</label><input type="text" id="editStudentMilestone" value="${escapeHtml(s.milestone)}"></div>
    <div class="form-group"><label>Streak</label><input type="number" id="editStudentStreak" value="${s.streak}" min="0"></div>
    <div class="actions"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveStudentProfile()"><i class="fas fa-save"></i> Save</button></div>
  `);
}

function saveStudentProfile() {
  state.student.name = document.getElementById('editStudentName').value.trim() || 'Student';
  state.student.avatar = document.getElementById('editStudentAvatar').value.trim() || state.student.name.charAt(0).toUpperCase();
  state.student.level = parseInt(document.getElementById('editStudentLevel').value);
  state.student.week = parseInt(document.getElementById('editStudentWeek').value);
  state.student.milestone = document.getElementById('editStudentMilestone').value.trim();
  state.student.streak = parseInt(document.getElementById('editStudentStreak').value) || 0;
  saveState();
  updateXPBar();
  showToast("Profile saved ✓", "success");
  closeModal();
  renderPage(currentPage);
}

function addFeedback() {
  openModal(`
    <h2><i class="fas fa-plus"></i> Add Feedback</h2>
    <div class="form-group"><label>Category</label><select id="feedbackCategory">
      <option>General</option><option>Grammar</option><option>Vocabulary</option><option>Pronunciation</option>
      <option>Speaking</option><option>Listening</option><option>Reading</option><option>Writing</option>
    </select></div>
    <div class="form-group"><label>Feedback *</label><textarea id="feedbackContent"></textarea></div>
    <div class="actions"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveNewFeedback()"><i class="fas fa-plus"></i> Add</button></div>
  `);
}

function saveNewFeedback() {
  const content = document.getElementById('feedbackContent').value.trim();
  if (!content) { showToast("Feedback required", "warning"); return; }
  const maxId = Math.max(0, ...state.feedback.map(f => f.id));
  state.feedback.unshift({ id: maxId + 1, date: new Date().toISOString().slice(0,10), category: document.getElementById('feedbackCategory').value, content, teacher: 'Teacher' });
  saveState();
  showToast("Feedback added ✓", "success");
  closeModal();
  renderPage(currentPage);
}

function editFeedback(id) {
  const f = state.feedback.find(x => x.id === id);
  if (!f) return;
  openModal(`
    <h2><i class="fas fa-edit"></i> Edit Feedback</h2>
    <div class="form-group"><label>Category</label><input type="text" id="editFeedbackCategory" value="${escapeHtml(f.category)}"></div>
    <div class="form-group"><label>Feedback</label><textarea id="editFeedbackContent">${escapeHtml(f.content)}</textarea></div>
    <div class="actions">
      <button class="btn btn-outline" onclick="deleteFeedback(${f.id})" style="margin-right: auto; color: var(--danger); border-color: var(--danger);"><i class="fas fa-trash"></i> Delete</button>
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveEditFeedback(${f.id})"><i class="fas fa-save"></i> Save</button>
    </div>
  `);
}

function saveEditFeedback(id) {
  const f = state.feedback.find(x => x.id === id);
  if (!f) return;
  f.category = document.getElementById('editFeedbackCategory').value.trim();
  f.content = document.getElementById('editFeedbackContent').value.trim();
  saveState();
  showToast("Feedback saved ✓", "success");
  closeModal();
  renderPage(currentPage);
}

function deleteFeedback(id) {
  confirmAction("Delete Feedback?", "This will remove this feedback.", () => {
    state.feedback = state.feedback.filter(f => f.id !== id);
    saveState();
    showToast("Feedback deleted", "info");
    closeModal();
    renderPage(currentPage);
  });
}

function showNotifications() {
  let html = '<h2><i class="fas fa-bell" style="color: var(--primary);"></i> Notifications</h2>';
  if (state.notifications.length === 0) html += '<div class="empty-state"><i class="fas fa-bell-slash"></i><p>No notifications</p></div>';
  else {
    state.notifications.forEach(n => {
      html += `<div style="display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border-light); align-items: flex-start;">
        <div style="width: 8px; height: 8px; border-radius: 50%; background: ${n.read ? 'var(--border)' : 'var(--primary)'}; margin-top: 6px; flex-shrink: 0;"></div>
        <div style="flex: 1;"><div style="font-size: 0.875rem; font-weight: ${n.read ? '500' : '700'};">${escapeHtml(n.text)}</div><div style="font-size: 0.72rem; color: var(--text-light); font-weight: 600;">${n.time}</div></div>
      </div>`;
    });
    state.notifications.forEach(n => n.read = true);
    saveState();
  }
  html += `<div style="margin-top: 16px; text-align: right; display: flex; gap: 8px; justify-content: flex-end;">
    <button class="btn btn-outline btn-sm" onclick="clearNotifications()">Clear All</button>
    <button class="btn btn-outline btn-sm" onclick="closeModal()">Close</button>
  </div>`;
  openModal(html);
}

function clearNotifications() {
  state.notifications = [];
  saveState();
  closeModal();
  showToast("Notifications cleared", "info");
}

/* ============================================================
   DATA MANAGEMENT
   ============================================================ */
function exportData() {
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `goosita-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("Data exported ✓", "success");
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const imported = JSON.parse(event.target.result);
        confirmAction("Import Data?", "This will replace all current data. Are you sure?", () => {
          state = imported;
          saveState();
          showToast("Data imported ✓", "success");
          renderPage(currentPage);
        });
      } catch (err) { showToast("Invalid file format", "error"); }
    };
    reader.readAsText(file);
  };
  input.click();
}

function confirmReset() {
  openModal(`
    <h2><i class="fas fa-lock" style="color: var(--danger);"></i> Reset All Data</h2>
    <p style="font-size: 0.875rem; color: var(--text-light); margin-bottom: 16px;">
      This will permanently delete ALL data. Enter the teacher password to confirm.
    </p>
    <div class="form-group">
      <label>Teacher Password</label>
      <input type="password" id="resetPasswordInput" placeholder="Enter password" onkeydown="if(event.key==='Enter') confirmResetSubmit()">
    </div>
    <div id="resetError" style="color: var(--danger); font-size: 0.8rem; margin-bottom: 8px; font-weight: 600;"></div>
    <div class="actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger" onclick="confirmResetSubmit()"><i class="fas fa-trash"></i> Reset Everything</button>
    </div>
  `);
  setTimeout(() => document.getElementById('resetPasswordInput')?.focus(), 100);
}

function confirmResetSubmit() {
  const input = document.getElementById('resetPasswordInput');
  const error = document.getElementById('resetError');
  if (!input || !error) return;
  if (input.value !== EDIT_PASSWORD) {
    error.textContent = "Incorrect password.";
    input.value = "";
    input.focus();
    return;
  }
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(TEACHER_MODE_KEY);
  state = getDefaultState();
  buildWeeksFromCurriculum();
  seedSampleData();
  saveState();
  teacherMode = false;
  updateTeacherModeUI();
  closeModal();
  showToast("All data reset", "info");
  navigateTo('dashboard');
}

/* ============================================================
   HELPERS
   ============================================================ */
function escapeHtml(text) {
  if (text === null || text === undefined) return '';
  const div = document.createElement('div');
  div.textContent = String(text);
  return div.innerHTML;
}

/* ============================================================
   INITIALIZATION
   ============================================================ */
document.addEventListener('DOMContentLoaded', async () => {
  const savedTheme = localStorage.getItem('goosita_theme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  if (savedTheme === 'dark') {
    document.getElementById('themeIcon').className = 'fas fa-sun';
    document.getElementById('themeLabel').textContent = 'Light Mode';
  }
  loadState();
  loadSyncConfig();
  updateXPBar();
  updateTeacherModeUI();
  navigateTo('dashboard');

  // If cloud sync is configured, pull latest data
  if (syncConfig) {
    syncStatus = 'saving'; updateSyncBadge();
    const success = await pullFromCloud(true);
    if (success) {
      updateXPBar();
      renderPage(currentPage);
    }
  }
});

document.addEventListener('click', (e) => {
  const sidebar = document.getElementById('sidebar');
  const toggle = document.querySelector('.menu-toggle');
  if (window.innerWidth <= 992 && sidebar.classList.contains('open')) {
    if (!sidebar.contains(e.target) && !toggle.contains(e.target)) {
      sidebar.classList.remove('open');
    }
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});
</script>
