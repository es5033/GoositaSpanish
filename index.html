<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Goosita · Spanish Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #E85A4F;
  --primary-dark: #D44A3F;
  --primary-light: #FCE9E7;
  --primary-glow: rgba(232,90,79,0.25);
  --secondary: #F4B942;
  --secondary-light: #FEF7E6;
  --accent: #F28C38;
  --accent-light: #FEF0E6;
  --bg: #FDFBF7;
  --card-bg: #FFFFFF;
  --text: #1F1D1A;
  --text-light: #7A756E;
  --border: #EDE8E0;
  --border-light: #F5F1EB;
  --success: #2E9E6B;
  --success-light: #E6F5EE;
  --warning: #E8A33D;
  --warning-light: #FEF7E6;
  --danger: #D94A4A;
  --danger-light: #FCE9E7;
  --info: #4A90E2;
  --info-light: #E6F0FA;
  --purple: #9B59B6;
  --purple-light: #F2E9F7;
  --shadow-xs: 0 1px 3px rgba(31,29,26,0.04);
  --shadow-sm: 0 2px 8px rgba(31,29,26,0.05);
  --shadow-md: 0 8px 24px rgba(31,29,26,0.07);
  --shadow-lg: 0 20px 48px rgba(31,29,26,0.12);
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 22px;
  --radius-xl: 28px;
  --sidebar-width: 260px;
  --transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
}

[data-theme="dark"] {
  --primary-light: #3D2A28;
  --secondary-light: #3D3524;
  --success-light: #1F3529;
  --warning-light: #3D3524;
  --danger-light: #3D2525;
  --info-light: #1F2D3D;
  --purple-light: #2D2335;
  --accent-light: #3D2A1F;
  --bg: #16150F;
  --card-bg: #221F1A;
  --text: #F5F1EA;
  --text-light: #A39C92;
  --border: #38332A;
  --border-light: #2A2621;
}

body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

.flex { display: flex; }
.flex-col { flex-direction: column; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.justify-center { justify-content: center; }
.gap-2 { gap: 8px; }
.gap-3 { gap: 12px; }
.gap-4 { gap: 16px; }
.text-sm { font-size: 0.875rem; }
.text-xs { font-size: 0.75rem; }
.text-light { color: var(--text-light); }
.w-full { width: 100%; }
.hidden { display: none !important; }
.cursor-pointer { cursor: pointer; }
.flex-wrap { flex-wrap: wrap; }
.flex-1 { flex: 1; }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-light); }

.app { display: flex; min-height: 100vh; }

/* SIDEBAR */
.sidebar {
  width: var(--sidebar-width);
  background: var(--card-bg);
  border-right: 1px solid var(--border);
  padding: 20px 14px;
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; bottom: 0; left: 0;
  z-index: 100;
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  overflow-y: auto;
}

.sidebar-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 4px 8px 22px;
  border-bottom: 1px solid var(--border-light);
  margin-bottom: 20px;
}

.logo-icon {
  width: 42px; height: 42px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  border-radius: 13px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 900; font-size: 1.35rem;
  flex-shrink: 0;
  box-shadow: 0 6px 16px var(--primary-glow);
}

.logo-text { font-weight: 800; font-size: 1.2rem; letter-spacing: -0.03em; line-height: 1.1; }
.logo-text span { color: var(--primary); display: block; font-size: 0.7rem; letter-spacing: 0.08em; font-weight: 700; text-transform: uppercase; margin-top: 2px; }

.nav-section { margin-bottom: 22px; }
.nav-label {
  font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--text-light); padding: 0 12px; margin-bottom: 8px; font-weight: 800;
}

.nav-item {
  display: flex; align-items: center; gap: 11px;
  padding: 10px 12px; border-radius: 11px;
  color: var(--text); text-decoration: none;
  font-size: 0.875rem; font-weight: 500;
  transition: var(--transition); cursor: pointer;
  border: none; background: none; width: 100%; text-align: left;
  font-family: inherit;
}

.nav-item i { width: 18px; font-size: 0.95rem; color: var(--text-light); transition: var(--transition); }
.nav-item:hover { background: var(--border-light); }
.nav-item.active { background: var(--primary-light); color: var(--primary); font-weight: 700; }
.nav-item.active i { color: var(--primary); }
.nav-item .badge { margin-left: auto; background: var(--primary); color: #fff; font-size: 0.6rem; padding: 2px 8px; border-radius: 100px; font-weight: 800; }

/* Cloud sync indicator */
.sync-status {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 0.7rem; padding: 4px 10px; border-radius: 100px;
  font-weight: 700; margin-left: auto;
}
.sync-status.on { background: var(--success-light); color: var(--success); }
.sync-status.off { background: var(--border-light); color: var(--text-light); }
.sync-status.saving { background: var(--secondary-light); color: #C48A1A; }
.sync-status.error { background: var(--danger-light); color: var(--danger); }

/* MAIN */
.main {
  flex: 1; margin-left: var(--sidebar-width);
  padding: 24px 32px 80px; min-width: 0;
}

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 28px; flex-wrap: wrap; gap: 12px;
}
.topbar-left { display: flex; align-items: center; gap: 14px; }
.menu-toggle { display: none; background: none; border: none; font-size: 1.3rem; color: var(--text); cursor: pointer; padding: 6px; }
.greeting h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.03em; }
.greeting p { color: var(--text-light); font-size: 0.85rem; font-weight: 500; }
.topbar-right { display: flex; align-items: center; gap: 10px; }

.icon-btn {
  width: 42px; height: 42px; border-radius: 13px;
  border: 1px solid var(--border); background: var(--card-bg);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text); transition: var(--transition);
  font-size: 1rem; position: relative; font-family: inherit;
}
.icon-btn:hover { background: var(--primary-light); border-color: var(--primary); color: var(--primary); transform: translateY(-1px); }
.icon-btn .dot { position: absolute; top: 9px; right: 9px; width: 8px; height: 8px; background: var(--primary); border-radius: 50%; border: 2px solid var(--card-bg); }

.avatar {
  width: 42px; height: 42px; border-radius: 13px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 800; font-size: 1rem; cursor: pointer; border: none;
  font-family: inherit; box-shadow: 0 4px 12px var(--primary-glow);
  transition: var(--transition);
}
.avatar:hover { transform: scale(1.05); }

/* CARDS */
.card {
  background: var(--card-bg); border-radius: var(--radius-lg);
  padding: 22px; box-shadow: var(--shadow-xs);
  border: 1px solid var(--border-light); transition: var(--transition);
}
.card:hover { box-shadow: var(--shadow-sm); }
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
.card-title { font-weight: 700; font-size: 0.95rem; display: flex; align-items: center; gap: 9px; }
.card-title i { color: var(--primary); }

/* PROGRESS */
.progress-bar { height: 8px; background: var(--border-light); border-radius: 100px; overflow: hidden; width: 100%; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); border-radius: 100px; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
.progress-fill.green { background: linear-gradient(90deg, #2E9E6B, #4CC38A); }
.progress-fill.blue { background: linear-gradient(90deg, #4A90E2, #6BB0F0); }
.progress-fill.yellow { background: linear-gradient(90deg, #F4B942, #F7CC6B); }
.progress-fill.purple { background: linear-gradient(90deg, #9B59B6, #B07FD0); }

/* BUTTONS */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 20px; border-radius: 11px; border: none;
  font-weight: 600; font-size: 0.875rem; cursor: pointer;
  transition: var(--transition); text-decoration: none; font-family: inherit;
  white-space: nowrap;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 12px var(--primary-glow); }
.btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 8px 20px var(--primary-glow); }
.btn-white { background: #fff; color: var(--primary); }
.btn-white:hover { background: #f5f5f5; transform: translateY(-1px); }
.btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
.btn-outline:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #C43E3E; }
.btn-success { background: var(--success); color: #fff; box-shadow: 0 4px 12px rgba(46,158,107,0.25); }
.btn-success:hover { background: #268A5C; transform: translateY(-1px); }
.btn-sm { padding: 8px 14px; font-size: 0.8rem; border-radius: 9px; }
.btn-xs { padding: 5px 10px; font-size: 0.72rem; border-radius: 7px; }

/* GRIDS */
.dashboard-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 24px; }
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

.stat-card {
  background: var(--card-bg); border-radius: var(--radius-lg);
  padding: 18px; border: 1px solid var(--border-light);
  display: flex; align-items: center; gap: 14px;
  transition: var(--transition);
}
.stat-card:hover { box-shadow: var(--shadow-sm); transform: translateY(-2px); }
.stat-icon {
  width: 48px; height: 48px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.15rem; flex-shrink: 0;
}
.stat-icon.orange { background: var(--primary-light); color: var(--primary); }
.stat-icon.yellow { background: var(--secondary-light); color: var(--secondary); }
.stat-icon.green { background: var(--success-light); color: var(--success); }
.stat-icon.blue { background: var(--info-light); color: var(--info); }
.stat-icon.red { background: var(--danger-light); color: var(--danger); }
.stat-icon.purple { background: var(--purple-light); color: var(--purple); }
.stat-info h3 { font-size: 1.4rem; font-weight: 800; line-height: 1.15; letter-spacing: -0.02em; }
.stat-info p { font-size: 0.75rem; color: var(--text-light); font-weight: 500; }

/* WELCOME */
.welcome-card {
  background: linear-gradient(135deg, #E85A4F 0%, #F28C38 100%);
  color: #fff; border-radius: var(--radius-xl);
  padding: 32px; position: relative; overflow: hidden; border: none;
  box-shadow: 0 12px 32px var(--primary-glow);
}
.welcome-card::before {
  content: ''; position: absolute; top: -50%; right: -20%;
  width: 400px; height: 400px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
}
.welcome-card::after {
  content: '🇪🇸'; position: absolute; right: 24px; bottom: -28px;
  font-size: 9rem; opacity: 0.13; transform: rotate(-8deg);
}
.welcome-card h2 { font-size: 1.85rem; font-weight: 900; margin-bottom: 6px; letter-spacing: -0.03em; position: relative; }
.welcome-card .level-badge {
  display: inline-block; background: rgba(255,255,255,0.22);
  padding: 5px 16px; border-radius: 100px; font-size: 0.72rem;
  font-weight: 800; backdrop-filter: blur(8px); margin-bottom: 16px;
  letter-spacing: 0.08em; position: relative;
}
.welcome-card .progress-label { display: flex; justify-content: space-between; font-size: 0.82rem; margin-bottom: 8px; opacity: 0.95; font-weight: 600; position: relative; }
.welcome-card .progress-bar { background: rgba(255,255,255,0.25); position: relative; }
.welcome-card .progress-fill { background: #fff; }
.welcome-card .milestone {
  margin-top: 20px; background: rgba(255,255,255,0.18);
  border-radius: 14px; padding: 14px 16px; backdrop-filter: blur(8px);
  font-size: 0.87rem; position: relative; border: 1px solid rgba(255,255,255,0.15);
  font-weight: 500;
}
.welcome-card .milestone i { margin-right: 9px; }
.welcome-card .welcome-actions { margin-top: 22px; display: flex; gap: 10px; flex-wrap: wrap; position: relative; }

/* ACTIVITY */
.activity-list { display: flex; flex-direction: column; gap: 9px; }
.activity-item {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 15px; border-radius: 13px;
  background: var(--bg); border: 1px solid var(--border-light);
  transition: var(--transition); cursor: pointer;
}
.activity-item:hover { border-color: var(--primary); background: var(--primary-light); transform: translateX(2px); }
.activity-check {
  width: 24px; height: 24px; border-radius: 8px;
  border: 2px solid var(--border); display: flex;
  align-items: center; justify-content: center;
  flex-shrink: 0; font-size: 0.65rem; color: transparent;
  transition: var(--transition); background: var(--card-bg);
}
.activity-check.done { background: var(--success); border-color: var(--success); color: #fff; }
.activity-content { flex: 1; min-width: 0; }
.activity-content .title { font-weight: 600; font-size: 0.875rem; }
.activity-content .meta { font-size: 0.72rem; color: var(--text-light); display: flex; gap: 12px; margin-top: 3px; flex-wrap: wrap; font-weight: 500; }

/* VOCAB */
.vocab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.vocab-card {
  background: var(--bg); border-radius: 13px; padding: 16px;
  border: 1px solid var(--border-light); transition: var(--transition);
  position: relative;
}
.vocab-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.vocab-card .spanish { font-weight: 700; font-size: 1.05rem; color: var(--primary); letter-spacing: -0.01em; }
.vocab-card .english { font-size: 0.82rem; color: var(--text-light); margin-top: 3px; font-weight: 500; }
.vocab-card .vocab-actions {
  position: absolute; top: 10px; right: 10px;
  display: flex; gap: 4px; opacity: 0;
  transition: opacity 0.2s;
}
.vocab-card:hover .vocab-actions { opacity: 1; }

/* MODAL */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(20,18,15,0.55);
  backdrop-filter: blur(6px); z-index: 200;
  display: flex; align-items: center; justify-content: center;
  padding: 16px; opacity: 0; pointer-events: none;
  transition: opacity 0.25s ease;
}
.modal-overlay.open { opacity: 1; pointer-events: auto; }
.modal {
  background: var(--card-bg); border-radius: var(--radius-xl);
  padding: 28px; max-width: 560px; width: 100%;
  max-height: 90vh; overflow-y: auto;
  box-shadow: var(--shadow-lg); transform: scale(0.94) translateY(10px);
  transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
  border: 1px solid var(--border-light);
}
.modal-overlay.open .modal { transform: scale(1) translateY(0); }
.modal.modal-lg { max-width: 820px; }
.modal.modal-xl { max-width: 1040px; }

/* XXL Modal for curriculum weeks */
.modal.modal-xxl {
  max-width: 1200px;
  width: 96vw;
  padding: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  max-height: 92vh;
}
.modal.modal-xxl .modal-body {
  overflow-y: auto;
  padding: 24px 28px;
  flex: 1;
}
.modal.modal-xxl .modal-footer {
  padding: 16px 28px;
  border-top: 1px solid var(--border-light);
  background: var(--card-bg);
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  flex-shrink: 0;
}
.modal.modal-xxl .modal-footer .btn-danger-left { margin-right: auto; }

.week-content-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.week-content-grid .week-content-block.full-width { grid-column: 1 / -1; }

.week-edit-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.week-edit-grid .full-width { grid-column: 1 / -1; }
.week-edit-grid .form-group { margin-bottom: 0; }
.week-edit-grid textarea { min-height: 100px; font-size: 0.85rem; }
.week-edit-grid textarea.tall { min-height: 160px; }

@media (max-width: 768px) {
  .week-content-grid { grid-template-columns: 1fr; }
  .week-edit-grid { grid-template-columns: 1fr; }
  .modal.modal-xxl { width: 100vw; max-width: 100vw; max-height: 100vh; border-radius: 0; }
  .modal.modal-xxl .modal-body { padding: 18px; }
  .modal.modal-xxl .modal-footer { padding: 14px 18px; }
}

.modal h2 { font-size: 1.25rem; margin-bottom: 18px; display: flex; align-items: center; gap: 12px; font-weight: 800; letter-spacing: -0.02em; }
.modal h2 i { color: var(--primary); }
.modal .form-group { margin-bottom: 16px; }
.modal label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 6px; color: var(--text-light); letter-spacing: 0.01em; }
.modal input, .modal textarea, .modal select {
  width: 100%; padding: 11px 14px; border-radius: 11px;
  border: 1.5px solid var(--border); background: var(--bg);
  color: var(--text); font-family: inherit; font-size: 0.9rem;
  transition: var(--transition); font-weight: 500;
}
.modal input:focus, .modal textarea:focus, .modal select:focus {
  outline: none; border-color: var(--primary);
  box-shadow: 0 0 0 4px var(--primary-glow);
  background: var(--card-bg);
}
.modal textarea { resize: vertical; min-height: 90px; line-height: 1.6; }
.modal .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; flex-wrap: wrap; }

/* TOAST */
.toast-container {
  position: fixed; bottom: 24px; right: 24px;
  z-index: 1000; display: flex; flex-direction: column; gap: 10px;
  pointer-events: none;
}
.toast {
  background: var(--card-bg); border-radius: 13px;
  padding: 13px 18px; box-shadow: var(--shadow-lg);
  border: 1px solid var(--border-light); display: flex;
  align-items: center; gap: 11px; font-size: 0.875rem;
  animation: slideIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  max-width: 360px; pointer-events: auto; font-weight: 500;
}
.toast.success { border-left: 4px solid var(--success); }
.toast.info { border-left: 4px solid var(--info); }
.toast.warning { border-left: 4px solid var(--warning); }
.toast.error { border-left: 4px solid var(--danger); }

@keyframes slideIn {
  from { transform: translateX(110%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

/* TABLE */
.table-wrapper {
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  border-radius: 14px; border: 1px solid var(--border-light);
}
table { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 600px; }
th {
  text-align: left; padding: 13px 16px; background: var(--bg);
  font-weight: 700; color: var(--text-light); font-size: 0.7rem;
  text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap;
}
td { padding: 13px 16px; border-top: 1px solid var(--border-light); font-weight: 500; }
tr:hover td { background: var(--primary-light); }

/* GRADE BADGES */
.grade-badge {
  display: inline-block; padding: 3px 11px; border-radius: 100px;
  font-weight: 700; font-size: 0.72rem;
}
.grade-badge.a { background: var(--success-light); color: var(--success); }
.grade-badge.b { background: var(--secondary-light); color: #C48A1A; }
.grade-badge.c { background: var(--accent-light); color: #D46B1A; }
.grade-badge.d { background: var(--danger-light); color: var(--danger); }

.status-badge {
  display: inline-block; padding: 4px 12px; border-radius: 100px;
  font-weight: 700; font-size: 0.72rem;
}
.status-not-started { background: var(--border-light); color: var(--text-light); }
.status-in-progress { background: var(--secondary); color: #fff; }
.status-submitted { background: var(--info); color: #fff; }
.status-graded { background: var(--success-light); color: var(--success); }
.status-overdue { background: var(--danger); color: #fff; }
.status-upcoming { background: var(--info-light); color: var(--info); }
.status-completed { background: var(--success-light); color: var(--success); }

/* BADGES */
.badges-grid { display: flex; flex-wrap: wrap; gap: 12px; }
.badge-item {
  display: flex; flex-direction: column; align-items: center;
  gap: 5px; padding: 16px 12px; background: var(--bg);
  border-radius: 14px; border: 1.5px solid var(--border-light);
  min-width: 100px; transition: var(--transition);
  position: relative;
}
.badge-item:hover { border-color: var(--secondary); transform: translateY(-3px); box-shadow: var(--shadow-sm); }
.badge-item .badge-icon { font-size: 2rem; }
.badge-item .badge-name { font-size: 0.72rem; font-weight: 700; text-align: center; }
.badge-item.locked { opacity: 0.32; filter: grayscale(1); }

/* ROADMAP */
.roadmap { display: flex; flex-direction: column; gap: 12px; }
.level-block {
  border: 1.5px solid var(--border-light); border-radius: var(--radius-lg);
  overflow: hidden; background: var(--card-bg); transition: var(--transition);
}
.level-block:hover { border-color: var(--border); box-shadow: var(--shadow-sm); }
.level-header {
  padding: 18px 22px; background: var(--bg); font-weight: 700;
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; transition: var(--transition); flex-wrap: wrap; gap: 10px;
}
.level-header:hover { background: var(--primary-light); }
.level-status {
  font-size: 0.72rem; padding: 4px 12px; border-radius: 100px;
  background: var(--border-light); color: var(--text-light); font-weight: 700;
}
.level-status.active { background: var(--primary); color: #fff; box-shadow: 0 4px 10px var(--primary-glow); }
.level-status.completed { background: var(--success-light); color: var(--success); }
.week-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
  gap: 10px; padding: 18px 22px 22px;
}
.week-item {
  padding: 12px 8px; border-radius: 12px; text-align: center;
  font-size: 0.78rem; font-weight: 700; border: 1.5px solid var(--border-light);
  background: var(--bg); transition: var(--transition); cursor: pointer;
  position: relative;
}
.week-item:hover { border-color: var(--primary); transform: translateY(-3px); box-shadow: var(--shadow-sm); }
.week-item.completed { background: var(--success-light); border-color: #A8DBC4; color: var(--success); }
.week-item.current { background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; border-color: transparent; box-shadow: 0 6px 16px var(--primary-glow); }
.week-item.locked { opacity: 0.45; cursor: not-allowed; }
.week-item .week-num { font-size: 0.65rem; opacity: 0.75; display: block; font-weight: 600; letter-spacing: 0.05em; }
.week-item .week-title { font-size: 0.62rem; margin-top: 3px; opacity: 0.85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* FEEDBACK */
.feedback-item {
  padding: 16px; border-left: 4px solid var(--primary);
  background: var(--bg); border-radius: 0 13px 13px 0; margin-bottom: 12px;
}
.feedback-item .meta {
  font-size: 0.72rem; color: var(--text-light);
  display: flex; gap: 14px; margin-bottom: 8px; flex-wrap: wrap;
  align-items: center; font-weight: 600;
}
.feedback-item .content { font-size: 0.875rem; line-height: 1.6; }

/* RINGS */
.rings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; }
.ring-item {
  text-align: center; padding: 20px 16px; background: var(--bg);
  border-radius: 16px; border: 1.5px solid var(--border-light);
  transition: var(--transition);
}
.ring-item:hover { border-color: var(--primary); transform: translateY(-2px); }
.ring-item .ring-value { font-size: 1.65rem; font-weight: 900; color: var(--primary); letter-spacing: -0.02em; }
.ring-item .ring-label { font-size: 0.78rem; color: var(--text-light); margin-top: 5px; text-transform: capitalize; font-weight: 600; }

/* BOTTOM NAV */
.bottom-nav {
  display: none; position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--card-bg); border-top: 1px solid var(--border-light);
  padding: 8px 10px; z-index: 150; justify-content: space-around;
  align-items: center; box-shadow: 0 -6px 20px rgba(0,0,0,0.06);
  padding-bottom: max(8px, env(safe-area-inset-bottom));
}
.bottom-nav-item {
  display: flex; flex-direction: column; align-items: center;
  gap: 3px; font-size: 0.62rem; color: var(--text-light);
  background: none; border: none; cursor: pointer;
  padding: 7px 11px; border-radius: 11px; transition: var(--transition);
  font-family: inherit; min-width: 56px; font-weight: 600;
}
.bottom-nav-item i { font-size: 1.2rem; }
.bottom-nav-item.active { color: var(--primary); }
.bottom-nav-item:hover { background: var(--primary-light); }

/* XP BAR */
.xp-bar-container {
  display: flex; align-items: center; gap: 12px;
  background: var(--card-bg); border-radius: 100px;
  padding: 5px 16px 5px 5px; border: 1.5px solid var(--border-light);
}
.xp-icon {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, var(--secondary), var(--accent));
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 0.72rem; font-weight: 900; flex-shrink: 0;
  box-shadow: 0 4px 10px rgba(244,185,66,0.3);
}
.xp-bar-wrapper { flex: 1; min-width: 80px; }
.xp-bar-wrapper .xp-label { font-size: 0.68rem; font-weight: 700; display: flex; justify-content: space-between; margin-bottom: 3px; }
.xp-bar { height: 6px; background: var(--border-light); border-radius: 100px; overflow: hidden; }
.xp-fill { height: 100%; background: linear-gradient(90deg, var(--secondary), var(--accent)); border-radius: 100px; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }

/* EMPTY */
.empty-state { text-align: center; padding: 50px 20px; color: var(--text-light); }
.empty-state i { font-size: 2.8rem; margin-bottom: 14px; opacity: 0.28; display: block; }
.empty-state p { font-size: 0.9rem; font-weight: 500; }

/* SECTION HEADER */
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
}
.section-header h2 { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.02em; }
.section-header .subtitle { font-size: 0.82rem; color: var(--text-light); font-weight: 500; }

/* TEACHER BANNER */
.teacher-banner {
  background: linear-gradient(135deg, var(--secondary), var(--accent));
  color: #fff; padding: 12px 20px; border-radius: 14px;
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px; font-size: 0.875rem; font-weight: 700;
  flex-wrap: wrap; gap: 10px;
  box-shadow: 0 6px 18px rgba(244,185,66,0.3);
}
.teacher-banner .btn { background: rgba(255,255,255,0.22); color: #fff; }
.teacher-banner .btn:hover { background: rgba(255,255,255,0.32); }

.lock-notice {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 0.72rem; color: var(--text-light);
  background: var(--border-light); padding: 4px 12px;
  border-radius: 100px; font-weight: 600;
}

/* TEST BUILDER */
.section-builder {
  border: 1.5px solid var(--border-light); border-radius: 14px;
  margin-bottom: 14px; overflow: hidden; background: var(--card-bg);
}
.section-builder-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px; background: var(--bg); cursor: pointer;
  font-weight: 700; font-size: 0.9rem;
}
.section-builder-header .section-icon { margin-right: 10px; font-size: 1.15rem; }
.section-builder-body {
  padding: 18px; border-top: 1px solid var(--border-light);
}
.question-item {
  display: flex; gap: 12px; padding: 14px;
  background: var(--bg); border-radius: 12px;
  margin-bottom: 10px; border: 1px solid var(--border-light);
  align-items: flex-start;
}
.question-item .q-num {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--primary); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.72rem; font-weight: 800; flex-shrink: 0;
}

.reward-banner {
  background: linear-gradient(135deg, var(--secondary), var(--accent));
  color: #fff; padding: 18px 22px; border-radius: 16px;
  display: flex; align-items: center; gap: 16px; margin-bottom: 18px;
  box-shadow: 0 8px 20px rgba(244,185,66,0.3);
}
.reward-banner .reward-icon { font-size: 2.4rem; }
.reward-banner .reward-text { flex: 1; font-size: 0.9rem; }
.reward-banner .reward-text strong { display: block; font-size: 1.02rem; margin-bottom: 3px; font-weight: 800; }

.attempt-indicator {
  display: flex; gap: 6px; align-items: center;
  font-size: 0.8rem; color: var(--text-light); font-weight: 600;
}
.attempt-dot {
  width: 11px; height: 11px; border-radius: 50%;
  background: var(--border);
}
.attempt-dot.used { background: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }

.inline-edit {
  background: var(--bg); border: 1.5px solid var(--border-light);
  border-radius: 9px; padding: 9px 13px;
  color: var(--text); font-family: inherit;
  font-size: 0.875rem; width: 100%;
  transition: var(--transition); font-weight: 500;
}
.inline-edit:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-glow); background: var(--card-bg); }

.assign-type-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 12px;
}
.assign-type-card {
  padding: 16px; border-radius: 13px;
  border: 2px solid var(--border-light); background: var(--bg);
  cursor: pointer; transition: var(--transition); text-align: center;
}
.assign-type-card:hover { border-color: var(--primary); transform: translateY(-2px); }
.assign-type-card.selected { border-color: var(--primary); background: var(--primary-light); }
.assign-type-card .at-icon { font-size: 1.7rem; margin-bottom: 7px; }
.assign-type-card .at-name { font-weight: 700; font-size: 0.82rem; }
.assign-type-card .at-desc { font-size: 0.68rem; color: var(--text-light); margin-top: 3px; font-weight: 500; }

/* WEEK VIEW MODAL */
.week-view-hero {
  border-radius: 20px; padding: 28px; margin-bottom: 22px;
  color: #fff; position: relative; overflow: hidden;
  box-shadow: 0 10px 30px var(--primary-glow);
}
.modal.modal-xxl .week-view-hero {
  border-radius: 0;
  margin: 0;
  padding: 22px 28px;
  box-shadow: none;
}
.week-view-hero::before {
  content: ''; position: absolute; top: -50%; right: -30%;
  width: 320px; height: 320px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.18) 0%, transparent 70%);
}
.week-view-hero .wvh-level {
  display: inline-block; background: rgba(255,255,255,0.22);
  padding: 4px 14px; border-radius: 100px; font-size: 0.7rem;
  font-weight: 800; backdrop-filter: blur(8px); margin-bottom: 12px;
  letter-spacing: 0.08em; position: relative;
}
.week-view-hero h2 { font-size: 1.65rem; font-weight: 900; letter-spacing: -0.03em; margin-bottom: 6px; position: relative; }
.week-view-hero .wvh-sub { font-size: 0.85rem; opacity: 0.92; font-weight: 500; position: relative; }

.week-content-block {
  background: var(--card-bg); border-radius: 16px;
  padding: 20px; margin-bottom: 14px;
  border: 1.5px solid var(--border-light);
  transition: var(--transition);
}
.week-content-block:hover { border-color: var(--primary); box-shadow: var(--shadow-sm); }
.week-content-block .block-header {
  display: flex; align-items: center; gap: 14px; margin-bottom: 14px;
}
.week-content-block .block-icon {
  width: 44px; height: 44px; border-radius: 13px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.15rem; flex-shrink: 0;
}
.week-content-block .block-icon.orange { background: var(--primary-light); color: var(--primary); }
.week-content-block .block-icon.yellow { background: var(--secondary-light); color: var(--secondary); }
.week-content-block .block-icon.green { background: var(--success-light); color: var(--success); }
.week-content-block .block-icon.blue { background: var(--info-light); color: var(--info); }
.week-content-block .block-icon.purple { background: var(--purple-light); color: var(--purple); }
.week-content-block .block-icon.accent { background: var(--accent-light); color: var(--accent); }
.week-content-block .block-label {
  font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--text-light); font-weight: 800;
}
.week-content-block .block-title {
  font-weight: 700; font-size: 1rem;
}
.week-content-block .block-content {
  font-size: 0.9rem; line-height: 1.75; color: var(--text);
  white-space: pre-wrap;
  padding: 14px 16px;
  background: var(--bg);
  border-radius: 12px;
  border-left: 3px solid var(--primary);
}

/* Grade summary card */
.grade-summary-card {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: #fff; border-radius: 20px; padding: 26px;
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 20px; margin-bottom: 24px;
  box-shadow: 0 10px 30px var(--primary-glow);
  position: relative; overflow: hidden;
}
.grade-summary-card::after {
  content: ''; position: absolute; right: -40px; top: -40px;
  width: 200px; height: 200px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
}
.grade-summary-card .gs-left { position: relative; }
.grade-summary-card .gs-label { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 800; opacity: 0.85; margin-bottom: 4px; }
.grade-summary-card .gs-value { font-size: 2.4rem; font-weight: 900; letter-spacing: -0.03em; line-height: 1; }
.grade-summary-card .gs-sub { font-size: 0.82rem; opacity: 0.9; margin-top: 6px; font-weight: 500; }

.grade-item-card {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 18px; border-radius: 14px;
  background: var(--bg); border: 1.5px solid var(--border-light);
  margin-bottom: 10px; transition: var(--transition);
  gap: 12px; flex-wrap: wrap; cursor: pointer;
}
.grade-item-card:hover { border-color: var(--primary); transform: translateX(3px); }
.grade-item-card .gi-left { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; }
.grade-item-card .gi-icon {
  width: 44px; height: 44px; border-radius: 13px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.15rem; flex-shrink: 0;
}
.grade-item-card .gi-info { flex: 1; min-width: 0; }
.grade-item-card .gi-title { font-weight: 700; font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grade-item-card .gi-meta { font-size: 0.72rem; color: var(--text-light); margin-top: 3px; font-weight: 500; display: flex; gap: 12px; flex-wrap: wrap; }
.grade-item-card .gi-score { text-align: right; flex-shrink: 0; }
.grade-item-card .gi-score-value { font-size: 1.3rem; font-weight: 900; letter-spacing: -0.02em; line-height: 1; }
.grade-item-card .gi-score-sub { font-size: 0.72rem; color: var(--text-light); margin-top: 4px; font-weight: 600; }

/* Level hero colors */
.level-hero-1 { background: linear-gradient(135deg, #E85A4F, #F28C38); }
.level-hero-2 { background: linear-gradient(135deg, #F4B942, #E8A33D); }
.level-hero-3 { background: linear-gradient(135deg, #2E9E6B, #4CC38A); }
.level-hero-4 { background: linear-gradient(135deg, #4A90E2, #6BB0F0); }
.level-hero-5 { background: linear-gradient(135deg, #9B59B6, #B07FD0); }
.level-hero-6 { background: linear-gradient(135deg, #D44A3F, #E85A4F); }

@media (max-width: 1200px) {
  .dashboard-grid { grid-template-columns: 1fr; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 992px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; padding: 18px 18px 90px; }
  .menu-toggle { display: flex; }
  .two-col { grid-template-columns: 1fr; }
}
@media (max-width: 768px) {
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .greeting h1 { font-size: 1.15rem; }
  .welcome-card { padding: 24px; }
  .welcome-card h2 { font-size: 1.4rem; }
  .bottom-nav { display: flex; }
  .week-grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); }
  .modal { padding: 22px; }
  .modal.modal-lg, .modal.modal-xl { max-width: 100%; }
  .toast-container { left: 12px; right: 12px; bottom: 78px; }
  .toast { max-width: none; }
  .xp-bar-container { display: none !important; }
}
@media (max-width: 480px) {
  .stats-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-card { padding: 14px; gap: 10px; }
  .stat-icon { width: 40px; height: 40px; font-size: 1rem; }
  .stat-info h3 { font-size: 1.1rem; }
  .main { padding: 14px 14px 90px; }
  .card { padding: 16px; }
  .week-view-hero { padding: 22px; }
  .week-view-hero h2 { font-size: 1.3rem; }
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.fade-in { animation: fadeIn 0.35s cubic-bezier(0.4, 0, 0.2, 1); }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo-icon">G</div>
      <div class="logo-text">Goosita<span>Spanish Academy</span></div>
    </div>

    <div class="nav-section">
      <div class="nav-label">Learning</div>
      <button class="nav-item active" data-page="dashboard" onclick="navigateTo('dashboard')">
        <i class="fas fa-home"></i> Dashboard
      </button>
      <button class="nav-item" data-page="curriculum" onclick="navigateTo('curriculum')">
        <i class="fas fa-road"></i> Curriculum
      </button>
      <button class="nav-item" data-page="lessons" onclick="navigateTo('lessons')">
        <i class="fas fa-book-open"></i> Lessons
      </button>
      <button class="nav-item" data-page="vocabulary" onclick="navigateTo('vocabulary')">
        <i class="fas fa-spell-check"></i> Vocabulary
        <span class="badge" id="vocabCountBadge">0</span>
      </button>
    </div>

    <div class="nav-section">
      <div class="nav-label">Assessment</div>
      <button class="nav-item" data-page="assignments" onclick="navigateTo('assignments')">
        <i class="fas fa-tasks"></i> Assignments
        <span class="badge" id="assignmentCountBadge">0</span>
      </button>
      <button class="nav-item" data-page="quizzes" onclick="navigateTo('quizzes')">
        <i class="fas fa-question-circle"></i> Quizzes
      </button>
      <button class="nav-item" data-page="tests" onclick="navigateTo('tests')">
        <i class="fas fa-file-alt"></i> Tests
      </button>
      <button class="nav-item" data-page="grades" onclick="navigateTo('grades')">
        <i class="fas fa-chart-bar"></i> Grades
      </button>
    </div>

    <div class="nav-section">
      <div class="nav-label">Progress</div>
      <button class="nav-item" data-page="badges" onclick="navigateTo('badges')">
        <i class="fas fa-medal"></i> Badges
      </button>
      <button class="nav-item" data-page="messages" onclick="navigateTo('messages')">
        <i class="fas fa-comment"></i> Messages
        <span class="badge" id="messageCountBadge">0</span>
      </button>
    </div>

    <div style="margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border-light);">
      <button class="nav-item" onclick="openSyncSettings()">
        <i class="fas fa-cloud"></i>
        <span>Cloud Sync</span>
        <span class="sync-status off" id="syncStatusBadge"><i class="fas fa-circle"></i> Off</span>
      </button>
      <button class="nav-item" onclick="toggleTeacherMode()">
        <i class="fas" id="teacherModeIcon"></i>
        <span id="teacherModeLabel">Teacher Mode: Off</span>
      </button>
      <button class="nav-item" onclick="toggleTheme()">
        <i class="fas fa-moon" id="themeIcon"></i>
        <span id="themeLabel">Dark Mode</span>
      </button>
      <button class="nav-item" onclick="exportData()">
        <i class="fas fa-download"></i> Export Data
      </button>
      <button class="nav-item" onclick="importData()">
        <i class="fas fa-upload"></i> Import Data
      </button>
      <button class="nav-item" onclick="confirmReset()">
        <i class="fas fa-trash"></i> Reset All
      </button>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" onclick="toggleSidebar()">
          <i class="fas fa-bars"></i>
        </button>
        <div class="greeting">
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageSubtitle">Welcome back</p>
        </div>
      </div>
      <div class="topbar-right">
        <div class="xp-bar-container" id="xpBarContainer">
          <div class="xp-icon">XP</div>
          <div class="xp-bar-wrapper">
            <div class="xp-label">
              <span id="xpDisplay">0 XP</span>
              <span id="xpLevelDisplay">Level 1</span>
            </div>
            <div class="xp-bar">
              <div class="xp-fill" id="xpFill" style="width: 0%;"></div>
            </div>
          </div>
        </div>
        <button class="icon-btn" onclick="showNotifications()">
          <i class="fas fa-bell"></i>
          <span class="dot" id="notifDot"></span>
        </button>
        <button class="avatar avatar-btn" onclick="navigateTo('profile')" id="avatarBtn">S</button>
      </div>
    </div>

    <div id="teacherBanner"></div>
    <div id="pageContent" class="fade-in"></div>

    <nav class="bottom-nav" id="bottomNav">
      <button class="bottom-nav-item active" data-page="dashboard" onclick="navigateTo('dashboard')">
        <i class="fas fa-home"></i><span>Home</span>
      </button>
      <button class="bottom-nav-item" data-page="curriculum" onclick="navigateTo('curriculum')">
        <i class="fas fa-road"></i><span>Learn</span>

/* ============================================================
   GITHUB SYNC
   ============================================================ */
let syncConfig = null; // { owner, repo, path, token, branch }
let syncDebounceTimer = null;
let syncStatus = 'off'; // off | on | saving | error

function loadSyncConfig() {
  try {
    const raw = localStorage.getItem(SYNC_CONFIG_KEY);
    if (raw) syncConfig = JSON.parse(raw);
  } catch (e) { syncConfig = null; }
  updateSyncBadge();
}

function saveSyncConfigToStorage() {
  if (syncConfig) localStorage.setItem(SYNC_CONFIG_KEY, JSON.stringify(syncConfig));
  else localStorage.removeItem(SYNC_CONFIG_KEY);
  updateSyncBadge();
}

function updateSyncBadge() {
  const badge = document.getElementById('syncStatusBadge');
  if (!badge) return;
  const cls = `sync-status ${syncStatus}`;
  badge.className = cls;
  const labels = {
    off: '<i class="fas fa-circle"></i> Off',
    on: '<i class="fas fa-cloud-check"></i> Synced',
    saving: '<i class="fas fa-spinner fa-spin"></i> Saving',
    error: '<i class="fas fa-exclamation-triangle"></i> Error',
  };
  badge.innerHTML = labels[syncStatus] || labels.off;
}

async function githubGetFile() {
  if (!syncConfig) return null;
  const { owner, repo, path, token, branch } = syncConfig;
  const url = `https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(path)}?ref=${branch || 'main'}`;
  try {
    const res = await fetch(url, {
      headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json' }
    });
    if (res.status === 404) return { data: null, sha: null };
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    const content = decodeURIComponent(escape(atob(json.content.replace(/\n/g, ''))));
    return { data: JSON.parse(content), sha: json.sha };
  } catch (e) {
    console.error('GitHub fetch error:', e);
    return { error: e.message };
  }
}

async function githubSaveFile(data, sha) {
  if (!syncConfig) return false;
  const { owner, repo, path, token, branch } = syncConfig;
  const url = `https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(path)}`;
  const body = {
    message: `Goosita sync — ${new Date().toISOString()}`,
    content: btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2)))),
    branch: branch || 'main',
  };
  if (sha) body.sha = sha;
  try {
    const res = await fetch(url, {
      method: 'PUT',
      headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    return json.content?.sha || true;
  } catch (e) {
    console.error('GitHub save error:', e);
    return false;
  }
}

async function pullFromCloud(silent = false) {
  if (!syncConfig) {
    if (!silent) showToast('Cloud sync not configured', 'warning');
    return false;
  }
  syncStatus = 'saving'; updateSyncBadge();
  const result = await githubGetFile();
  if (result.error) {
    syncStatus = 'error'; updateSyncBadge();
    if (!silent) showToast(`Sync error: ${result.error}`, 'error');
    return false;
  }
  if (result.data) {
    state = result.data;
    window._syncSha = result.sha;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    syncStatus = 'on'; updateSyncBadge();
    if (!silent) showToast('☁️ Pulled data from GitHub', 'success');
    renderPage(currentPage);
    updateXPBar();
  } else {
    // First time — push current local
    syncStatus = 'on'; updateSyncBadge();
    await pushToCloud(true);
    if (!silent) showToast('☁️ Initialized cloud file from local data', 'success');
  }
  return true;
}

async function pushToCloud(silent = false) {
  if (!syncConfig) return false;
  syncStatus = 'saving'; updateSyncBadge();
  const sha = window._syncSha || null;
  const result = await githubSaveFile(state, sha);
  if (result) {
    window._syncSha = result;
    syncStatus = 'on'; updateSyncBadge();
    if (!silent) showToast('☁️ Saved to GitHub', 'success');
    return true;
  } else {
    syncStatus = 'error'; updateSyncBadge();
    if (!silent) showToast('Failed to save to GitHub', 'error');
    return false;
  }
}

function scheduleSyncToCloud() {
  if (!syncConfig) return;
  clearTimeout(syncDebounceTimer);
  syncStatus = 'saving'; updateSyncBadge();
  syncDebounceTimer = setTimeout(() => pushToCloud(true), 1500);
}

  openModal(`

    <p style="font-size: 0.85rem; color: var(--text-light); margin-bottom: 16px; line-height: 1.6;">
      Save your data to a GitHub repository so it syncs across all browsers and devices.

async function saveSyncSettings() {
  const owner = document.getElementById('syncOwner').value.trim();
  const repo = document.getElementById('syncRepo').value.trim();
  const path = document.getElementById('syncPath').value.trim() || 'data.json';
  const branch = document.getElementById('syncBranch').value.trim() || 'main';
  const token = document.getElementById('syncToken').value.trim();
  const resultEl = document.getElementById('syncTestResult');

  if (!owner || !repo || !token) {
    resultEl.style.color = 'var(--danger)';
    resultEl.textContent = 'Please fill in owner, repo, and token.';
    return;
  }
  syncConfig = { owner, repo, path, branch, token };
  resultEl.style.color = 'var(--info)';
  resultEl.textContent = 'Testing connection...';

  // Test by reading the file
  const res = await githubGetFile();
  if (res.error) {
    resultEl.style.color = 'var(--danger)';
    resultEl.textContent = `Error: ${res.error}. Check your settings and token permissions.`;
    syncConfig = null;
    return;
  }

  saveSyncConfigToStorage();
  resultEl.style.color = 'var(--success)';
  resultEl.textContent = res.data ? 'Connected! Cloud has data — pulling...' : 'Connected! No data yet — pushing local...';

  if (res.data) {
    state = res.data;
    window._syncSha = res.sha;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } else {
    await pushToCloud(true);
  }
  syncStatus = 'on'; updateSyncBadge();
  setTimeout(() => { closeModal(); renderPage(currentPage); updateXPBar(); showToast('☁️ Cloud sync enabled', 'success'); }, 800);
}

function disconnectSync() {
  syncConfig = null;
  window._syncSha = null;
  syncStatus = 'off';
  saveSyncConfigToStorage();
  closeModal();
  showToast('Cloud sync disconnected', 'info');
}

   ============================================================ */
let state = null;
let teacherMode = false;
let currentPage = 'dashboard';

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      state = JSON.parse(saved);
      const defaults = getDefaultState();
      Object.keys(defaults).forEach(key => {
        if (state[key] === undefined) state[key] = defaults[key];
      });
    } else {
      state = getDefaultState();
      buildWeeksFromCurriculum();
      seedSampleData();
      saveState();
    }
  } catch (e) {
    console.error("Error loading state:", e);
    state = getDefaultState();
    buildWeeksFromCurriculum();
  }
  const savedTeacher = localStorage.getItem(TEACHER_MODE_KEY);
  teacherMode = savedTeacher === 'true';
}

function buildWeeksFromCurriculum() {
  state.weeks = [];
  state.levels.forEach(level => {
    for (let i = 1; i <= level.totalWeeks; i++) {
      const globalWeek = level.startWeek + i - 1;
      const content = WEEK_CONTENT[globalWeek] || {};
      state.weeks.push({
        id: globalWeek, level: level.id, weekNum: i, globalWeek,
        title: content.title || `Week ${globalWeek}`,
        objectives: content.objectives || "", vocabulary: content.vocabulary || "",
        grammar: content.grammar || "", speaking: content.speaking || "",
        listening: content.listening || "", reading: content.reading || "",
        writing: content.writing || "", review: content.review || "",
        teacherNotes: "", completed: false,
      });
    }
  });
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    updateBadges();
    scheduleSyncToCloud();
  } catch (e) {
    showToast("Error saving data. Storage may be full.", "error");
  }
}

function updateBadges() {
  const vc = document.getElementById('vocabCountBadge');
  const ac = document.getElementById('assignmentCountBadge');
  const mc = document.getElementById('messageCountBadge');
  if (vc) vc.textContent = state.vocab.length;
  if (ac) ac.textContent = state.assignments.filter(a => a.status !== 'Graded').length;
  if (mc) mc.textContent = state.messages.filter(m => !m.read).length;
}

function seedSampleData() {
  state.vocab = [
    { id: 1, spanish: "hola", english: "hello", status: "Introduced", category: "Survival" },
    { id: 2, spanish: "gracias", english: "thank you", status: "Introduced", category: "Survival" },
    { id: 3, spanish: "por favor", english: "please", status: "Introduced", category: "Survival" },

  state.feedback = [
    { id: 1, date: new Date().toISOString().slice(0,10), category: "General", content: "Welcome to Goosita! Your 52-week Spanish journey awaits.", teacher: "Teacher" },
  ];
  state.notifications = [
    { id: 1, text: "Welcome to Goosita Spanish Academy!", time: "Just now", read: false },
  ];
}

  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  const icon = document.getElementById('themeIcon');
  const label = document.getElementById('themeLabel');
  if (next === 'dark') { icon.className = 'fas fa-sun'; label.textContent = 'Light Mode'; }
  else { icon.className = 'fas fa-moon'; label.textContent = 'Dark Mode'; }
  localStorage.setItem('goosita_theme', next);
}

function updateXPBar() {
  const s = state.student;
  const xpEl = document.getElementById('xpDisplay');
  const levelEl = document.getElementById('xpLevelDisplay');
  const fillEl = document.getElementById('xpFill');
  if (xpEl) xpEl.textContent = s.xp.toLocaleString() + ' XP';
  if (levelEl) levelEl.textContent = 'Level ' + s.xpLevel;
  if (fillEl) fillEl.style.width = Math.min(100, (s.xp / s.xpNext) * 100) + '%';
  const avatarBtn = document.getElementById('avatarBtn');
  if (avatarBtn) avatarBtn.textContent = s.avatar || s.name.charAt(0).toUpperCase();
}

function addXP(amount, reason = '') {
  state.student.xp += amount;
  while (state.student.xp >= state.student.xpNext) {
    state.student.xpLevel++;
    state.student.xpNext = Math.round(state.student.xpNext * 1.5);
    showToast(`🎉 Level up! You're now Level ${state.student.xpLevel}!`, "success");
  }
  saveState();
  updateXPBar();
  if (reason) showToast(`+${amount} XP ${reason}`, "success");
}

/* ============================================================
   TOAST & MODAL
   ============================================================ */
function showToast(message, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  const icons = { success: 'fa-check-circle', info: 'fa-info-circle', warning: 'fa-exclamation-triangle', error: 'fa-times-circle' };
  toast.innerHTML = `<i class="fas ${icons[type] || icons.info}" style="color: var(--${type === 'success' ? 'success' : type === 'warning' ? 'warning' : type === 'error' ? 'danger' : 'info'})"></i><span>${message}</span>`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(100%)';
    toast.style.transition = 'all 0.3s ease';
    setTimeout(() => toast.remove(), 300);
  }, 3500);
}

function openModal(html, size = '') {
  const content = document.getElementById('modalContent');
  const sizeClass = size === 'lg' ? ' modal-lg' : size === 'xl' ? ' modal-xl' : size === 'xxl' ? ' modal-xxl' : '';
  content.className = 'modal' + sizeClass;
  content.innerHTML = html;
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
document.getElementById('modalOverlay').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeModal(); });

function confirmAction(title, message, onConfirm, confirmLabel = "Confirm", danger = true) {
  openModal(`
    <h2><i class="fas ${danger ? 'fa-exclamation-triangle' : 'fa-question-circle'}" style="color: ${danger ? 'var(--danger)' : 'var(--primary)'};"></i> ${title}</h2>
    <p style="font-size: 0.875rem; color: var(--text-light); margin-bottom: 16px;">${message}</p>
    <div class="actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" onclick="window._confirmCb()">${confirmLabel}</button>
    </div>
  `);
  window._confirmCb = () => { closeModal(); onConfirm(); };
}
