        </div>
        <p style="font-size: 1.05rem; font-weight: 600; color: var(--primary); margin-bottom: 8px;">"${escapeHtml(s.milestone)}"</p>
        <div class="progress-bar" style="margin-top: 10px;">
          <div class="progress-fill" style="width: ${s.progress}%;"></div>
        </div>
        <p style="font-size: 0.75rem; color: var(--text-light); margin-top: 6px;">${s.progress}% complete</p>
      </div>
    </div>

    <div class="two-col">
      <div class="card">
        <div class="card-header">
          <div class="card-title"><i class="fas fa-chart-bar"></i> Skill Breakdown</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 12px;">
          ${Object.entries(state.skills).map(([skill, val]) => `
            <div>
              <div style="display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 4px;">
                <span style="font-weight: 500; text-transform: capitalize;">${skill}</span>
                <span style="font-weight: 600;">${val}%</span>
              </div>
              <div class="progress-bar" style="height: 6px;">
                <div class="progress-fill ${val > 80 ? 'green' : val > 65 ? '' : 'yellow'}" style="width: ${val}%;"></div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title"><i class="fas fa-medal"></i> Badges Earned</div>
        </div>
        <div class="badges-grid">
          ${state.badges.filter(b => b.earned).length === 0 ? '<p style="font-size: 0.85rem; color: var(--text-light);">No badges earned yet.</p>' : state.badges.filter(b => b.earned).map(b => `
            <div class="badge-item" style="min-width: 70px; padding: 10px;">
              <div class="badge-icon" style="font-size: 1.4rem;">${b.icon}</div>
              <div class="badge-name" style="font-size: 0.65rem;">${escapeHtml(b.name)}</div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>

    <div style="margin-top: 20px;" class="card">
      <div class="card-header">
        <div class="card-title"><i class="fas fa-comment-dots"></i> Recent Feedback</div>
        ${teacherMode ? `<button class="btn btn-outline btn-sm" onclick="addFeedback()"><i class="fas fa-plus"></i> Add</button>` : ''}
      </div>
      ${state.feedback.length === 0 ? '<div class="empty-state"><i class="fas fa-comment-slash"></i><p>No feedback yet</p></div>' : state.feedback.map(f => `
        <div class="feedback-item">
          <div class="meta">
            <span><i class="fas fa-user"></i> ${escapeHtml(f.teacher || 'Teacher')}</span>
            <span><i class="fas fa-calendar"></i> ${f.date}</span>
            <span class="grade-badge" style="background: var(--primary-light); color: var(--primary);">${escapeHtml(f.category)}</span>
          </div>
          <div class="content">${escapeHtml(f.content)}</div>
          ${teacherMode ? `<div style="margin-top: 8px; display: flex; gap: 6px;">
            <button class="btn btn-outline btn-xs" onclick="editFeedback(${f.id})"><i class="fas fa-edit"></i></button>
            <button class="btn btn-outline btn-xs" onclick="deleteFeedback(${f.id})"><i class="fas fa-trash"></i></button>
          </div>` : ''}
        </div>
      `).join('')}
    </div>
  `;
}

function editStudentProfile() {
  const s = state.student;
  openModal(`
    <h2><i class="fas fa-user-edit"></i> Edit Student Profile</h2>
    <div class="form-group">
      <label>Name</label>
      <input type="text" id="editStudentName" value="${escapeHtml(s.name)}">
    </div>
    <div class="form-group">
      <label>Avatar (1-2 characters)</label>
      <input type="text" id="editStudentAvatar" value="${escapeHtml(s.avatar)}" maxlength="2">
    </div>
    <div class="form-group">
      <label>Current Level</label>
      <select id="editStudentLevel">
        ${state.levels.map(l => `<option value="${l.id}" ${l.id === s.level ? 'selected' : ''}>Level ${l.id} — ${l.name}</option>`).join('')}
      </select>
    </div>
    <div class="form-group">
      <label>Current Week</label>
      <input type="number" id="editStudentWeek" value="${s.week}" min="1">
    </div>
    <div class="form-group">
      <label>Milestone</label>
      <input type="text" id="editStudentMilestone" value="${escapeHtml(s.milestone)}">
    </div>
    <div class="form-group">
      <label>Streak</label>
      <input type="number" id="editStudentStreak" value="${s.streak}" min="0">
    </div>
    <div class="actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveStudentProfile()"><i class="fas fa-save"></i> Save</button>
    </div>
  `);
}

function saveStudentProfile() {
  state.student.name = document.getElementById('editStudentName').value.trim() || 'Student';
  state.student.avatar = document.getElementById('editStudentAvatar').value.trim() || state.student.name.charAt(0).toUpperCase();
  state.student.level = parseInt(document.getElementById('editStudentLevel').value);
  state.student.week = parseInt(document.getElementById('editStudentWeek').value);
  state.student.milestone = document.getElementById('editStudentMilestone').value.trim();
  state.student.streak = parseInt(document.getElementById('editStudentStreak').value) || 0;
  saveState();
  updateXPBar();
  showToast("Profile saved ✓", "success");
  closeModal();
  renderPage(currentPage);
}

/* ============================================================
   FEEDBACK
   ============================================================ */
function addFeedback() {
  openModal(`
    <h2><i class="fas fa-plus"></i> Add Feedback</h2>
    <div class="form-group">
      <label>Category</label>
      <select id="feedbackCategory">
        <option>General</option>
        <option>Grammar</option>
        <option>Vocabulary</option>
        <option>Pronunciation</option>
        <option>Speaking</option>
        <option>Listening</option>
        <option>Reading</option>
        <option>Writing</option>
      </select>
    </div>
    <div class="form-group">
      <label>Feedback *</label>
      <textarea id="feedbackContent" placeholder="Leave your feedback..."></textarea>
    </div>
    <div class="actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveNewFeedback()"><i class="fas fa-plus"></i> Add</button>
    </div>
  `);
}

function saveNewFeedback() {
  const content = document.getElementById('feedbackContent').value.trim();
  if (!content) { showToast("Feedback text is required", "warning"); return; }
  const maxId = Math.max(0, ...state.feedback.map(f => f.id));
  state.feedback.unshift({
    id: maxId + 1,
    date: new Date().toISOString().slice(0,10),
    category: document.getElementById('feedbackCategory').value,
    content,
    teacher: 'Teacher',
  });
  saveState();
  showToast("Feedback added ✓", "success");
  closeModal();
  renderPage(currentPage);
}

function editFeedback(id) {
  const f = state.feedback.find(x => x.id === id);
  if (!f) return;
  openModal(`
    <h2><i class="fas fa-edit"></i> Edit Feedback</h2>
    <div class="form-group">
      <label>Category</label>
      <input type="text" id="editFeedbackCategory" value="${escapeHtml(f.category)}">
    </div>
    <div class="form-group">
      <label>Feedback</label>
      <textarea id="editFeedbackContent">${escapeHtml(f.content)}</textarea>
    </div>
    <div class="actions">
      <button class="btn btn-outline" onclick="deleteFeedback(${f.id})" style="margin-right: auto; color: var(--danger); border-color: var(--danger);"><i class="fas fa-trash"></i> Delete</button>
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveEditFeedback(${f.id})"><i class="fas fa-save"></i> Save</button>
    </div>
  `);
}

function saveEditFeedback(id) {
  const f = state.feedback.find(x => x.id === id);
  if (!f) return;
  f.category = document.getElementById('editFeedbackCategory').value.trim();
  f.content = document.getElementById('editFeedbackContent').value.trim();
  saveState();
  showToast("Feedback saved ✓", "success");
  closeModal();
  renderPage(currentPage);
}

function deleteFeedback(id) {
  confirmAction("Delete Feedback?", "This will remove this feedback.", () => {
    state.feedback = state.feedback.filter(f => f.id !== id);
    saveState();
    showToast("Feedback deleted", "info");
    closeModal();
    renderPage(currentPage);
  });
}

/* ============================================================
   NOTIFICATIONS
   ============================================================ */
function showNotifications() {
  let html = '<h2><i class="fas fa-bell" style="color: var(--primary);"></i> Notifications</h2>';
  if (state.notifications.length === 0) {
    html += '<div class="empty-state"><i class="fas fa-bell-slash"></i><p>No notifications</p></div>';
  } else {
    state.notifications.forEach(n => {
      html += `
        <div style="display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); align-items: flex-start;">
          <div style="width: 8px; height: 8px; border-radius: 50%; background: ${n.read ? 'var(--border)' : 'var(--primary)'}; margin-top: 6px; flex-shrink: 0;"></div>
          <div style="flex: 1;">
            <div style="font-size: 0.875rem; font-weight: ${n.read ? '400' : '500'};">${escapeHtml(n.text)}</div>
            <div style="font-size: 0.7rem; color: var(--text-light);">${n.time}</div>
          </div>
        </div>
      `;
    });
    state.notifications.forEach(n => n.read = true);
    saveState();
  }
  html += `<div style="margin-top: 16px; text-align: right; display: flex; gap: 8px; justify-content: flex-end;">
    <button class="btn btn-outline btn-sm" onclick="clearNotifications()">Clear All</button>
    <button class="btn btn-outline btn-sm" onclick="closeModal()">Close</button>
  </div>`;
  openModal(html);
}

function clearNotifications() {
  state.notifications = [];
  saveState();
  closeModal();
  showToast("Notifications cleared", "info");
}

/* ============================================================
   DATA IMPORT/EXPORT/RESET
   ============================================================ */
function exportData() {
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `goosita-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("Data exported ✓", "success");
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const imported = JSON.parse(event.target.result);
        confirmAction("Import Data?", "This will replace all current data. Are you sure?", () => {
          state = imported;
          saveState();
          showToast("Data imported ✓", "success");
          renderPage(currentPage);
        });
      } catch (err) {
        showToast("Invalid file format", "error");
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function confirmReset() {
  confirmAction("Reset Everything?", "This will delete ALL data including lessons, vocabulary, assignments, and progress. This cannot be undone!", () => {
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(TEACHER_MODE_KEY);
    state = getDefaultState();
    seedSampleData();
    saveState();
    teacherMode = false;
    updateTeacherModeUI();
    showToast("All data reset", "info");
    navigateTo('dashboard');
  }, "Reset Everything", true);
}

/* ============================================================
   INITIALIZATION
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  // Load theme
  const savedTheme = localStorage.getItem('goosita_theme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  if (savedTheme === 'dark') {
    document.getElementById('themeIcon').className = 'fas fa-sun';
    document.getElementById('themeLabel').textContent = 'Light Mode';
  }

  loadState();
  updateXPBar();
  updateTeacherModeUI();
  navigateTo('dashboard');
});

// Close sidebar on outside click (mobile)
document.addEventListener('click', (e) => {
  const sidebar = document.getElementById('sidebar');
  const toggle = document.querySelector('.menu-toggle');
  if (window.innerWidth <= 992 && sidebar.classList.contains('open')) {
    if (!sidebar.contains(e.target) && !toggle.contains(e.target)) {
      sidebar.classList.remove('open');
    }
  }
});

// Keyboard shortcut: Esc closes modal
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

// Helper
function escapeHtml(text) {
  if (text === null || text === undefined) return '';
  const div = document.createElement('div');
  div.textContent = String(text);
  return div.innerHTML;
}
</script>
