/* ============================================================
   DASHBOARD
   ============================================================ */
function renderDashboard() {
  const s = state.student;
  const completedTasks = state.dailyTasks.filter(t => t.done).length;
  const totalTasks = state.dailyTasks.length;
  const masteredVocab = state.vocab.filter(v => v.status === 'Mastered').length;
  const currentLevelData = state.levels.find(l => l.id === s.level) || state.levels[0];
  const globalWeek = currentLevelData.startWeek + s.week - 1;

  return `
    <div class="dashboard-grid">
      <div class="welcome-card">
        <div class="level-badge">LEVEL ${s.level} — ${currentLevelData.name.toUpperCase()}</div>
        <h2>¡Hola, ${escapeHtml(s.name)}!</h2>
        <p style="opacity: 0.92; font-size: 0.9rem; font-weight: 500;">Week ${globalWeek} of 52 · ${escapeHtml(s.milestone)}</p>
        <div style="margin-top: 20px;">
          <div class="progress-label"><span>Course Progress</span><span>${s.progress}%</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width: ${s.progress}%;"></div></div>
        </div>
        <div class="milestone"><i class="fas fa-trophy"></i> ${escapeHtml(s.milestone)}</div>
        <div class="welcome-actions">
          <button class="btn btn-white" onclick="navigateTo('curriculum')"><i class="fas fa-play"></i> Continue Learning</button>
          <button class="btn btn-white" style="background: rgba(255,255,255,0.2); color: #fff;" onclick="navigateTo('assignments')"><i class="fas fa-tasks"></i> View Assignments</button>
        </div>
      </div>
      <div class="card">
        <div class="card-header">
          <div class="card-title"><i class="fas fa-clock"></i> Today's 60-min Session</div>
          <span class="text-xs text-light">${completedTasks}/${totalTasks}</span>
        </div>
        <div class="progress-bar" style="margin-bottom: 16px;"><div class="progress-fill green" style="width: ${(completedTasks/totalTasks)*100}%;"></div></div>
        <div class="activity-list">
          ${state.dailyTasks.map(task => `
            <div class="activity-item" onclick="toggleDailyTask(${task.id})">
              <div class="activity-check ${task.done ? 'done' : ''}"><i class="fas fa-check"></i></div>
              <div class="activity-content"><div class="title">${escapeHtml(task.label)}</div></div>
              ${task.done ? '<span class="text-xs text-success font-semibold">+' + task.xp + ' XP</span>' : ''}
            </div>
          `).join('')}
        </div>
      </div>
    </div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-icon orange"><i class="fas fa-fire"></i></div><div class="stat-info"><h3>${s.streak}</h3><p>Day Streak</p></div></div>
      <div class="stat-card"><div class="stat-icon yellow"><i class="fas fa-star"></i></div><div class="stat-info"><h3>${s.xp.toLocaleString()}</h3><p>Total XP · Lvl ${s.xpLevel}</p></div></div>
      <div class="stat-card"><div class="stat-icon green"><i class="fas fa-graduation-cap"></i></div><div class="stat-info"><h3>${computeOverallGrade()}%</h3><p>Overall Grade</p></div></div>
      <div class="stat-card"><div class="stat-icon blue"><i class="fas fa-book"></i></div><div class="stat-info"><h3>${masteredVocab}/${state.vocab.length}</h3><p>Vocab Mastered</p></div></div>
    </div>
    <div class="two-col">
      <div class="card">
        <div class="card-header"><div class="card-title"><i class="fas fa-chart-bar"></i> Skill Progress</div></div>
        <div class="rings-grid">
          ${Object.entries(state.skills).map(([skill, val]) => `
            <div class="ring-item">
              <div class="ring-value">${val}%</div>
              <div class="ring-label">${skill}</div>
              <div class="progress-bar" style="margin-top: 10px; height: 5px;"><div class="progress-fill ${val > 80 ? 'green' : val > 65 ? '' : 'yellow'}" style="width: ${val}%;"></div></div>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="card">
        <div class="card-header">
          <div class="card-title"><i class="fas fa-comment-dots"></i> Recent Feedback</div>
          ${teacherMode ? `<button class="btn btn-outline btn-sm" onclick="addFeedback()"><i class="fas fa-plus"></i> Add</button>` : ''}
        </div>
        ${state.feedback.length === 0 ? '<div class="empty-state"><i class="fas fa-comment-slash"></i><p>No feedback yet</p></div>' : state.feedback.slice(0, 3).map(f => `
          <div class="feedback-item">
            <div class="meta">
              <span><i class="fas fa-user"></i> ${escapeHtml(f.teacher || 'Teacher')}</span>
              <span><i class="fas fa-calendar"></i> ${f.date}</span>
              <span class="grade-badge" style="background: var(--primary-light); color: var(--primary);">${escapeHtml(f.category)}</span>
            </div>
            <div class="content">${escapeHtml(f.content)}</div>
          </div>
        `).join('')}
      </div>
    </div>
    <div style="margin-top: 24px;">
      <div class="section-header">
        <h2><i class="fas fa-medal" style="color: var(--secondary); margin-right: 8px;"></i>Badges</h2>
        <button class="btn btn-outline btn-sm" onclick="navigateTo('badges')">View All</button>
      </div>
      <div class="badges-grid">
        ${state.badges.slice(0, 6).map(b => `
          <div class="badge-item ${b.earned ? '' : 'locked'}">
            <div class="badge-icon">${b.icon}</div>
            <div class="badge-name">${escapeHtml(b.name)}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function toggleDailyTask(id) {
  const task = state.dailyTasks.find(t => t.id === id);
  if (task) {
    task.done = !task.done;
    if (task.done) addXP(task.xp, "for daily practice!");
    saveState();
    renderPage(currentPage);
  }
}

/* ============================================================
   GRADE COMPUTATION
   ============================================================ */
function computeOverallGrade() {
  const items = [];
  state.assignments.forEach(a => { if (a.score !== null && a.points > 0) items.push((a.score / a.points) * 100); });
  Object.values(state.quizAttempts).forEach(qa => { if (qa.scores && qa.scores.length > 0) items.push(Math.max(...qa.scores)); });
  Object.values(state.testAttempts).forEach(ta => { if (ta.scores && ta.scores.length > 0) items.push(Math.max(...ta.scores)); });
  if (items.length === 0) return 0;
  return Math.round(items.reduce((s, v) => s + v, 0) / items.length);
}

function computeCategoryAverage(category) {
  const items = [];
  if (category === 'Assignments') state.assignments.forEach(a => { if (a.score !== null && a.points > 0) items.push((a.score / a.points) * 100); });
  else if (category === 'Quizzes') Object.values(state.quizAttempts).forEach(qa => { if (qa.scores && qa.scores.length > 0) items.push(Math.max(...qa.scores)); });
  else if (category === 'Tests') Object.values(state.testAttempts).forEach(ta => { if (ta.scores && ta.scores.length > 0) items.push(Math.max(...ta.scores)); });
  if (items.length === 0) return 0;
  return Math.round(items.reduce((s, v) => s + v, 0) / items.length);
}

/* ============================================================
   CURRICULUM
   ============================================================ */
function renderCurriculum() {
  let html = `
    <div class="section-header">
      <div>
        <h2>Your 52-Week Spanish Journey</h2>
        <p class="subtitle">LEVEL → WEEK → LEARN → PRACTICE → PROGRESS</p>
      </div>
      ${teacherMode ? `<button class="btn btn-primary btn-sm" onclick="addLevel()"><i class="fas fa-plus"></i> Add Level</button>` : `<span class="lock-notice"><i class="fas fa-lock"></i> Teacher can edit</span>`}
    </div>
    <div class="roadmap">
  `;
  state.levels.forEach((level, idx) => {
    const levelWeeks = state.weeks.filter(w => w.level === level.id);
    const completedWeeks = levelWeeks.filter(w => w.completed).length;
    const isCurrent = state.student.level === level.id;
    const isCompleted = levelWeeks.length > 0 && completedWeeks === levelWeeks.length;
    const progress = levelWeeks.length > 0 ? Math.round((completedWeeks / levelWeeks.length) * 100) : 0;
    html += `
      <div class="level-block">
        <div class="level-header" onclick="toggleLevel(${idx})">
          <div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap;">
            <span style="font-weight: 800; font-size: 1.05rem; letter-spacing: -0.02em;">LEVEL ${level.id} — ${level.name.toUpperCase()}</span>
            <span style="font-size: 0.75rem; color: var(--text-light); font-weight: 600;">Weeks ${level.startWeek}–${level.endWeek} · ${completedWeeks}/${levelWeeks.length}</span>
          </div>
          <div style="display: flex; align-items: center; gap: 12px;">
            ${isCompleted ? '<span class="level-status completed">✓ Completed</span>' : isCurrent ? '<span class="level-status active">← Current</span>' : `<span class="level-status">${progress}%</span>`}
            <i class="fas fa-chevron-down" style="color: var(--text-light); font-size: 0.8rem;"></i>
          </div>
        </div>
        <div style="padding: 0 22px 8px; font-size: 0.82rem; color: var(--text-light); font-weight: 500;">${escapeHtml(level.description)}</div>
        <div class="week-grid" id="weeks-${idx}" style="display: ${isCurrent || isCompleted || teacherMode ? 'grid' : 'none'};">
          ${levelWeeks.map(w => {
            let status = 'locked';
            if (w.completed) status = 'completed';
            else if (isCurrent && w.weekNum === state.student.week) status = 'current';
            else if (isCurrent && w.weekNum < state.student.week) status = 'completed';
            return `<div class="week-item ${status}" onclick="openWeek(${w.id})">
              <span class="week-num">Week ${w.globalWeek}</span>
              <div class="week-title">${escapeHtml(w.title || '')}</div>
            </div>`;
          }).join('')}
        </div>
      </div>
    `;
  });
  html += `</div>`;
  return html;
}

function toggleLevel(idx) {
  const grid = document.getElementById(`weeks-${idx}`);
  if (grid) grid.style.display = grid.style.display === 'none' ? 'grid' : 'none';
}

function openWeek(id) {
  const week = state.weeks.find(w => w.id === id);
  if (!week) return;
  const levelData = state.levels.find(l => l.id === week.level) || { name: 'Level' };

  const contentBlocks = [];
  const addBlock = (icon, iconClass, label, title, content, fullWidth = false) => {
    if (content && content.trim()) contentBlocks.push({ icon, iconClass, label, title, content, fullWidth });
  };
  addBlock('fa-bullseye', 'orange', 'Learning Objectives', 'What You Will Learn', week.objectives, true);
  addBlock('fa-spell-check', 'blue', 'Vocabulary', 'Vocabulary & Phrases', week.vocabulary);
  addBlock('fa-pen-fancy', 'purple', 'Grammar', 'Grammar Focus', week.grammar);
  addBlock('fa-microphone', 'accent', 'Speaking', 'Speaking Practice', week.speaking);
  addBlock('fa-headphones', 'green', 'Listening', 'Listening Practice', week.listening);
  addBlock('fa-book', 'yellow', 'Reading', 'Reading Material', week.reading);
  addBlock('fa-pen', 'purple', 'Writing', 'Writing Practice', week.writing);
  addBlock('fa-rotate', 'green', 'Review', 'Review & Assessment', week.review, true);

  const heroClass = `level-hero-${week.level}`;
  const completedPill = week.completed ? '<span class="grade-badge a" style="padding: 8px 16px; font-size: 0.78rem;">✓ Completed</span>' : '';

  if (!teacherMode) {
    openModal(`
      <div class="week-view-hero ${heroClass}">
        <div class="wvh-level">LEVEL ${week.level} · ${levelData.name.toUpperCase()}</div>
        <h2 style="margin: 0;">Week ${week.globalWeek} — ${escapeHtml(week.title)}</h2>
        <div class="wvh-sub">${contentBlocks.length} content section${contentBlocks.length !== 1 ? 's' : ''} · ${week.completed ? 'Completed' : 'In Progress'}</div>
      </div>
      <div class="modal-body">
        ${contentBlocks.length === 0 ? `<div class="empty-state"><i class="fas fa-file-alt"></i><p>No content added to this week yet.</p></div>` : `
          <div class="week-content-grid">
            ${contentBlocks.map(b => `
              <div class="week-content-block ${b.fullWidth ? 'full-width' : ''}">
                <div class="block-header">
                  <div class="block-icon ${b.iconClass}"><i class="fas ${b.icon}"></i></div>
                  <div>
                    <div class="block-label">${b.label}</div>
                    <div class="block-title">${b.title}</div>
                  </div>
                </div>
                <div class="block-content">${escapeHtml(b.content)}</div>
              </div>
            `).join('')}
          </div>
        `}
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal()">Close</button>
        ${!week.completed ? `<button class="btn btn-success" onclick="completeWeek(${week.id})"><i class="fas fa-check"></i> Mark Week Complete</button>` : completedPill}
      </div>
    `, 'xxl');
    return;
  }

  openModal(`
    <div class="week-view-hero ${heroClass}">
      <div class="wvh-level">EDITING · LEVEL ${week.level} · ${levelData.name.toUpperCase()}</div>
      <h2 style="margin: 0;">Week ${week.globalWeek} — ${escapeHtml(week.title || 'Untitled')}</h2>
      <div class="wvh-sub">Edit any field · Leave blank to hide that section from students</div>
    </div>
    <div class="modal-body">
      <div class="week-edit-grid">
        <div class="form-group full-width"><label>Week Title</label><input type="text" id="weekTitle" value="${escapeHtml(week.title)}"></div>
        <div class="form-group full-width"><label>Learning Objectives</label><textarea id="weekObjectives">${escapeHtml(week.objectives)}</textarea></div>
        <div class="form-group"><label>Vocabulary</label><textarea id="weekVocab" class="tall">${escapeHtml(week.vocabulary)}</textarea></div>
        <div class="form-group"><label>Grammar</label><textarea id="weekGrammar" class="tall">${escapeHtml(week.grammar)}</textarea></div>
        <div class="form-group"><label>Speaking</label><textarea id="weekSpeaking">${escapeHtml(week.speaking)}</textarea></div>
        <div class="form-group"><label>Listening</label><textarea id="weekListening">${escapeHtml(week.listening)}</textarea></div>
        <div class="form-group"><label>Reading</label><textarea id="weekReading">${escapeHtml(week.reading)}</textarea></div>
        <div class="form-group"><label>Writing</label><textarea id="weekWriting">${escapeHtml(week.writing)}</textarea></div>
        <div class="form-group full-width"><label>Review & Assessment</label><textarea id="weekReview">${escapeHtml(week.review || '')}</textarea></div>
        <div class="form-group full-width"><label>Teacher Notes (private)</label><textarea id="weekTeacherNotes">${escapeHtml(week.teacherNotes)}</textarea></div>
      </div>
    </div>
    <div class="modal-footer">
      ${week.completed ? `<button class="btn btn-outline btn-danger-left" onclick="uncompleteWeek(${week.id})"><i class="fas fa-undo"></i> Mark Incomplete</button>` : ''}
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveWeek(${week.id})"><i class="fas fa-save"></i> Save Week</button>
    </div>
  `, 'xxl');
}

function saveWeek(id) {
  const week = state.weeks.find(w => w.id === id);
  if (!week) return;
  week.title = document.getElementById('weekTitle').value;
  week.objectives = document.getElementById('weekObjectives').value;
  week.vocabulary = document.getElementById('weekVocab').value;
  week.grammar = document.getElementById('weekGrammar').value;
  week.speaking = document.getElementById('weekSpeaking').value;
  week.listening = document.getElementById('weekListening').value;
  week.reading = document.getElementById('weekReading').value;
  week.writing = document.getElementById('weekWriting').value;
  week.review = document.getElementById('weekReview').value;
  week.teacherNotes = document.getElementById('weekTeacherNotes').value;
  saveState();
  showToast("Week saved ✓", "success");
  closeModal();
  renderPage(currentPage);
}

function completeWeek(id) {
  const week = state.weeks.find(w => w.id === id);
  if (!week) return;
  week.completed = true;
  if (week.weekNum === state.student.week) {
    state.student.week++;
    const currentLevel = state.levels.find(l => l.id === state.student.level);
    if (currentLevel && state.student.week > currentLevel.totalWeeks) {
      const nextLevel = state.levels.find(l => l.id === state.student.level + 1);
      if (nextLevel) {
        state.student.level = nextLevel.id;
        state.student.week = 1;
        showToast(`🎉 Level up! Welcome to Level ${nextLevel.id} — ${nextLevel.name}!`, "success");
      }
    }
    state.student.progress = Math.min(100, Math.round(((week.globalWeek) / 52) * 100));
  }
  addXP(50, "for completing a week!");
  saveState();
  showToast("Week completed! 🎉", "success");
  closeModal();
  renderPage(currentPage);
}

function uncompleteWeek(id) {
  const week = state.weeks.find(w => w.id === id);
  if (!week) return;
  week.completed = false;
  saveState();
  showToast("Week marked incomplete", "info");
  closeModal();
  renderPage(currentPage);
}

function addLevel() {
  openModal(`
    <h2><i class="fas fa-layer-group"></i> Add Level</h2>
    <div class="form-group"><label>Level Name</label><input type="text" id="newLevelName" placeholder="e.g., Mastery"></div>
    <div class="form-group"><label>Number of Weeks</label><input type="number" id="newLevelWeeks" value="8" min="1" max="52"></div>
    <div class="form-group"><label>Description</label><textarea id="newLevelDesc"></textarea></div>
    <div class="actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveNewLevel()"><i class="fas fa-plus"></i> Create Level</button>
    </div>
  `);
}

function saveNewLevel() {
  const name = document.getElementById('newLevelName').value.trim();
  const weeks = parseInt(document.getElementById('newLevelWeeks').value) || 8;
  const desc = document.getElementById('newLevelDesc').value.trim();
  if (!name) { showToast("Please enter a level name", "warning"); return; }
  const newId = Math.max(0, ...state.levels.map(l => l.id)) + 1;
  const maxEnd = Math.max(...state.levels.map(l => l.endWeek));
  state.levels.push({ id: newId, name, startWeek: maxEnd + 1, endWeek: maxEnd + weeks, totalWeeks: weeks, description: desc });
  let maxWeekId = Math.max(0, ...state.weeks.map(w => w.id));
  for (let i = 1; i <= weeks; i++) {
    state.weeks.push({
      id: ++maxWeekId, level: newId, weekNum: i, globalWeek: maxEnd + i,
      title: `Week ${maxEnd + i}`, objectives: "", vocabulary: "", grammar: "",
      speaking: "", listening: "", reading: "", writing: "", review: "",
      teacherNotes: "", completed: false,
    });
  }
  saveState();
  showToast("Level created ✓", "success");
  closeModal();
  renderPage(currentPage);
}

/* ============================================================
   LESSONS
   ============================================================ */
function renderLessons() {
  const lessonCategories = [...new Set(state.lessons.map(l => l.category).filter(Boolean))];
  return `
    <div class="section-header">
      <div><h2>Lesson Library</h2><p class="subtitle">${state.lessons.length} lesson${state.lessons.length !== 1 ? 's' : ''}</p></div>
      ${teacherMode ? `<button class="btn btn-primary btn-sm" onclick="addLesson()"><i class="fas fa-plus"></i> New Lesson</button>` : `<span class="lock-notice"><i class="fas fa-lock"></i> Teacher can add lessons</span>`}
    </div>
    ${lessonCategories.length > 0 ? `
      <div class="card" style="margin-bottom: 18px;">
        <div class="card-header"><div class="card-title"><i class="fas fa-filter"></i> Categories</div></div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <button class="btn btn-outline btn-xs" onclick="renderPage('lessons')">All</button>
          ${lessonCategories.map(c => `<button class="btn btn-outline btn-xs" onclick="filterLessons('${escapeHtml(c).replace(/'/g, "\\'")}')">${escapeHtml(c)}</button>`).join('')}
        </div>
      </div>
    ` : ''}
    ${state.lessons.length === 0 ? `<div class="card"><div class="empty-state"><i class="fas fa-book-open"></i><p>No lessons yet. ${teacherMode ? 'Click "New Lesson" to create your first lesson.' : 'Your teacher will add lessons soon.'}</p></div></div>` : `
      <div class="two-col" id="lessonGrid">
        ${state.lessons.map(l => `
          <div class="card" style="cursor: pointer;" data-category="${escapeHtml(l.category || '')}" onclick="openLesson(${l.id})">
            <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 10px;">
              <span class="grade-badge" style="background: var(--primary-light); color: var(--primary);">${escapeHtml(l.category || 'Lesson')}</span>
              <span class="text-xs text-light font-semibold">${l.duration || 60} min</span>
            </div>
            <h3 style="font-size: 1.05rem; font-weight: 700; margin-bottom: 8px;">${escapeHtml(l.title)}</h3>
            <p style="font-size: 0.82rem; color: var(--text-light); margin-bottom: 12px;">${escapeHtml(l.description || 'No description')}</p>
            <div style="display: flex; gap: 6px; flex-wrap: wrap;">
              <span class="grade-badge" style="background: var(--secondary-light); color: #C48A1A;">Level ${l.level}</span>
              ${teacherMode ? `
                <button class="btn btn-outline btn-xs" onclick="event.stopPropagation(); editLesson(${l.id})"><i class="fas fa-edit"></i></button>
                <button class="btn btn-outline btn-xs" onclick="event.stopPropagation(); deleteLesson(${l.id})"><i class="fas fa-trash"></i></button>
              ` : ''}
            </div>
          </div>
        `).join('')}
      </div>
    `}
  `;
}

function filterLessons(cat) {
  document.querySelectorAll('#lessonGrid .card').forEach(el => {
    el.style.display = !cat || el.dataset.category === cat ? '' : 'none';
  });
}

function addLesson() {
  openModal(`
    <h2><i class="fas fa-book-open"></i> New Lesson</h2>
    <div class="form-group"><label>Lesson Title *</label><input type="text" id="lessonTitle"></div>
    <div class="form-group"><label>Lesson Type</label>
      <select id="lessonType"><option value="Lesson">Lesson</option><option value="Grammar">Grammar</option><option value="Vocabulary">Vocabulary</option><option value="Speaking">Speaking</option><option value="Listening">Listening</option><option value="Reading">Reading</option><option value="Writing">Writing</option><option value="Culture">Culture</option></select>
    </div>
    <div class="form-group"><label>Category</label><input type="text" id="lessonCategory"></div>
    <div class="form-group"><label>Duration (minutes)</label><input type="number" id="lessonDuration" value="60" min="1"></div>
    <div class="form-group"><label>Description</label><textarea id="lessonDesc"></textarea></div>
    <div class="form-group"><label>Content</label><textarea id="lessonContent" style="min-height: 140px;"></textarea></div>
    <div class="form-group"><label>Level</label>
      <select id="lessonLevel">${state.levels.map(l => `<option value="${l.id}">Level ${l.id} — ${l.name}</option>`).join('')}</select>
    </div>
    <div class="actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveNewLesson()"><i class="fas fa-plus"></i> Create</button>
    </div>
  `, 'lg');
}

function saveNewLesson() {
  const title = document.getElementById('lessonTitle').value.trim();
  if (!title) { showToast("Please enter a title", "warning"); return; }
  const maxId = Math.max(0, ...state.lessons.map(l => l.id));
  state.lessons.push({
    id: maxId + 1, title,
    type: document.getElementById('lessonType').value,
    category: document.getElementById('lessonCategory').value.trim() || "General",
    duration: parseInt(document.getElementById('lessonDuration').value) || 60,
    description: document.getElementById('lessonDesc').value.trim(),
    content: document.getElementById('lessonContent').value.trim(),
    level: parseInt(document.getElementById('lessonLevel').value) || 1,
  });
  saveState();
  showToast("Lesson created ✓", "success");

      <div class="card" style="margin-bottom: 22px;">
        <div class="card-header"><div class="card-title"><i class="fas fa-filter"></i> Categories</div></div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <button class="btn btn-outline btn-xs" onclick="renderPage('vocabulary')">All</button>
          ${categories.map(c => `<button class="btn btn-outline btn-xs" onclick="filterVocab('${escapeHtml(c).replace(/'/g, "\\'")}')">${escapeHtml(c)}</button>`).join('')}

      </div>

        <div class="vocab-grid" id="vocabGrid">
          ${state.vocab.map(v => `
            <div class="vocab-card" data-category="${escapeHtml(v.category || '')}">
              ${teacherMode ? `
                <div class="vocab-actions">
                  <button class="btn btn-outline btn-xs" onclick="editVocab(${v.id})"><i class="fas fa-edit"></i></button>
                  <button class="btn btn-outline btn-xs" onclick="deleteVocab(${v.id})"><i class="fas fa-trash"></i></button>
                </div>
              ` : ''}
              <div class="spanish">${escapeHtml(v.spanish)}</div>
              <div class="english">${escapeHtml(v.english)}</div>
              <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px; gap: 6px;">
                <span class="grade-badge ${v.status === 'Mastered' ? 'a' : v.status === 'Practiced' ? 'b' : v.status === 'Introduced' ? 'c' : 'd'}" style="font-size: 0.65rem;">${v.status}</span>
                ${v.category ? `<span class="text-xs text-light font-semibold">${escapeHtml(v.category)}</span>` : ''}
              </div>
            </div>
          `).join('')}
        </div>
      `}

  `;
}

function filterVocab(cat) {
  document.querySelectorAll('#vocabGrid .vocab-card').forEach(el => {
    el.style.display = !cat || el.dataset.category === cat ? '' : 'none';
  });
}

function addVocab() {
  openModal(`
    <h2><i class="fas fa-plus"></i> Add Vocabulary Word</h2>
    <div class="form-group"><label>Spanish *</label><input type="text" id="vocabSpanish"></div>
    <div class="form-group"><label>English *</label><input type="text" id="vocabEnglish"></div>
    <div class="form-group"><label>Category</label><input type="text" id="vocabCategory" list="vocabCategoryList">
      <datalist id="vocabCategoryList">${[...new Set(state.vocab.map(v => v.category))].filter(Boolean).map(c => `<option value="${escapeHtml(c)}">`).join('')}</datalist>
    </div>
    <div class="form-group"><label>Status</label>
      <select id="vocabStatus">
        <option value="Introduced">Introduced</option>
        <option value="Practiced">Practiced</option>
        <option value="Mastered">Mastered</option>
        <option value="Needs Review">Needs Review</option>
      </select>
    </div>
    <div class="actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveNewVocab()"><i class="fas fa-plus"></i> Add</button>
    </div>
  `);

}

function saveNewVocab() {
  const spanish = document.getElementById('vocabSpanish').value.trim();
  const english = document.getElementById('vocabEnglish').value.trim();
  if (!spanish || !english) { showToast("Spanish and English are required", "warning"); return; }
  const maxId = Math.max(0, ...state.vocab.map(v => v.id));
  state.vocab.push({
    id: maxId + 1, spanish, english,
    category: document.getElementById('vocabCategory').value.trim() || "General",
    status: document.getElementById('vocabStatus').value,
  });
  saveState();
  showToast("Word added ✓", "success");
  closeModal();
  renderPage(currentPage);
}

function editVocab(id) {
  const v = state.vocab.find(x => x.id === id);
  if (!v) return;
  openModal(`
    <h2><i class="fas fa-edit"></i> Edit Word</h2>
    <div class="form-group"><label>Spanish *</label><input type="text" id="editVocabSpanish" value="${escapeHtml(v.spanish)}"></div>
    <div class="form-group"><label>English *</label><input type="text" id="editVocabEnglish" value="${escapeHtml(v.english)}"></div>

    <div class="form-group"><label>Status</label>

    <div class="actions">
      <button class="btn btn-outline" onclick="deleteVocab(${v.id})" style="margin-right: auto; color: var(--danger); border-color: var(--danger);"><i class="fas fa-trash"></i> Delete</button>
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>

function saveEditVocab(id) {
  const v = state.vocab.find(x => x.id === id);

  v.spanish = document.getElementById('editVocabSpanish').value.trim();

  v.category = document.getElementById('editVocabCategory').value.trim();
  v.status = document.getElementById('editVocabStatus').value;
  saveState();
  showToast("Word updated ✓", "success");
  closeModal();
  renderPage(currentPage);
}

function deleteVocab(id) {
  confirmAction("Delete Word?", "This will remove this vocabulary word.", () => {
    state.vocab = state.vocab.filter(v => v.id !== id);
    saveState();
    showToast("Word deleted", "info");

/* ============================================================
   ASSIGNMENTS
   ============================================================ */
function renderAssignments() {
  const upcoming = state.assignments.filter(a => a.status !== 'Graded');
  const past = state.assignments.filter(a => a.status === 'Graded');
  return `
    <div class="section-header">
      <div><h2>Assignments</h2><p class="subtitle">${upcoming.length} pending · ${past.length} completed</p></div>
      ${teacherMode ? `<button class="btn btn-primary btn-sm" onclick="addAssignment()"><i class="fas fa-plus"></i> New Assignment</button>` : `<span class="lock-notice"><i class="fas fa-lock"></i> Teacher creates assignments</span>`}
    </div>
    ${upcoming.length > 0 ? `
      <div class="section-header" style="margin-bottom: 12px;"><h3 style="font-size: 1rem; font-weight: 700;"><i class="fas fa-clock" style="color: var(--primary); margin-right: 8px;"></i>Upcoming</h3></div>
      <div style="margin-bottom: 28px;">
        ${upcoming.map(a => {
          const icon = getAssignmentIcon(a.category);
          return `
            <div class="grade-item-card" onclick="openAssignment(${a.id})">
              <div class="gi-left">
                <div class="gi-icon" style="background: ${icon.bg}; color: ${icon.color};"><i class="fas ${icon.fa}"></i></div>
                <div class="gi-info">
                  <div class="gi-title">${escapeHtml(a.title)}</div>
                  <div class="gi-meta">
                    <span><i class="fas fa-tag"></i> ${escapeHtml(a.category)}</span>
                    <span><i class="fas fa-calendar"></i> Due ${a.due}</span>
                    <span><i class="fas fa-star"></i> ${a.points} pts</span>
                  </div>
                </div>
              </div>
              <div style="display: flex; align-items: center; gap: 10px;">
                <span class="status-badge status-${a.status.toLowerCase().replace(/\s+/g, '-')}">${a.status}</span>
                ${teacherMode ? `<button class="btn btn-outline btn-xs" onclick="event.stopPropagation(); editAssignment(${a.id})"><i class="fas fa-edit"></i></button>` : ''}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    ` : ''}
    ${past.length > 0 ? `
      <div class="section-header" style="margin-bottom: 12px;"><h3 style="font-size: 1rem; font-weight: 700;"><i class="fas fa-check-circle" style="color: var(--success); margin-right: 8px;"></i>Completed</h3></div>
      ${past.map(a => {
        const icon = getAssignmentIcon(a.category);
        const pct = a.score !== null ? Math.round((a.score / a.points) * 100) : null;
        return `
          <div class="grade-item-card" onclick="openAssignment(${a.id})">
            <div class="gi-left">
              <div class="gi-icon" style="background: ${icon.bg}; color: ${icon.color};"><i class="fas ${icon.fa}"></i></div>
              <div class="gi-info">
                <div class="gi-title">${escapeHtml(a.title)}</div>
                <div class="gi-meta"><span><i class="fas fa-tag"></i> ${escapeHtml(a.category)}</span><span><i class="fas fa-calendar"></i> ${a.due}</span></div>
              </div>
            </div>
            <div class="gi-score">
              <div class="gi-score-value">${pct !== null ? `<span class="grade-badge ${pct >= 90 ? 'a' : pct >= 80 ? 'b' : pct >= 70 ? 'c' : 'd'}">${pct}%</span>` : '—'}</div>
              <div class="gi-score-sub">${a.score !== null ? `${a.score}/${a.points}` : ''}</div>
            </div>
          </div>
        `;
      }).join('')}
    ` : ''}
    ${state.assignments.length === 0 ? `<div class="card"><div class="empty-state"><i class="fas fa-tasks"></i><p>No assignments yet. ${teacherMode ? 'Click "New Assignment" to create one.' : 'Your teacher will add assignments soon.'}</p></div></div>` : ''}
  `;
}

function getAssignmentIcon(category) {
  const map = {
    'Speaking': { fa: 'fa-microphone', color: '#E85A4F', bg: '#FCE9E7' },
    'Writing': { fa: 'fa-pen', color: '#9B59B6', bg: '#F2E9F7' },
    'Reading': { fa: 'fa-book', color: '#F4B942', bg: '#FEF7E6' },
    'Listening': { fa: 'fa-headphones', color: '#2E9E6B', bg: '#E6F5EE' },
    'Translation': { fa: 'fa-language', color: '#4A90E2', bg: '#E6F0FA' },
    'Conversation': { fa: 'fa-comments', color: '#F28C38', bg: '#FEF0E6' },
    'Vocabulary': { fa: 'fa-spell-check', color: '#4A90E2', bg: '#E6F0FA' },
    'Grammar': { fa: 'fa-pen-fancy', color: '#9B59B6', bg: '#F2E9F7' },
    'Homework': { fa: 'fa-tasks', color: '#E85A4F', bg: '#FCE9E7' },
    'Worksheet': { fa: 'fa-file-alt', color: '#F28C38', bg: '#FEF0E6' },
    'Project': { fa: 'fa-project-diagram', color: '#2E9E6B', bg: '#E6F5EE' },
  };
  return map[category] || { fa: 'fa-tasks', color: '#E85A4F', bg: '#FCE9E7' };
}

function addAssignment() {
  openModal(`
    <h2><i class="fas fa-plus"></i> New Assignment</h2>
    <div class="form-group"><label>Title *</label><input type="text" id="assignTitle"></div>
    <div class="form-group">
      <label>Assignment Type</label>
      <div class="assign-type-grid" id="assignTypeGrid">
        ${state.assignmentTypes.map(t => `
          <div class="assign-type-card" data-type="${t.id}" onclick="selectAssignType('${t.id}')">
            <div class="at-icon">${t.icon}</div>
            <div class="at-name">${t.name}</div>
            <div class="at-desc">${t.desc}</div>
          </div>
        `).join('')}
      </div>
      <input type="hidden" id="assignCategory" value="Speaking">
    </div>
    <div class="form-group"><label>Due Date</label><input type="date" id="assignDue" value="${new Date(Date.now() + 7*86400000).toISOString().slice(0,10)}"></div>
    <div class="form-group"><label>Points</label><input type="number" id="assignPoints" value="20" min="1"></div>
    <div class="form-group"><label>Instructions</label><textarea id="assignInstructions" style="min-height: 100px;"></textarea></div>
    <div class="form-group"><label>Resource URL (optional)</label><input type="url" id="assignResource"></div>
    <div class="actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveNewAssignment()"><i class="fas fa-plus"></i> Create</button>
    </div>
  `, 'lg');
  setTimeout(() => selectAssignType('speaking'), 100);
}

function selectAssignType(typeId) {
  document.querySelectorAll('#assignTypeGrid .assign-type-card').forEach(el => {
    el.classList.toggle('selected', el.dataset.type === typeId);
  });
  const t = state.assignmentTypes.find(x => x.id === typeId);
  const hidden = document.getElementById('assignCategory');
  if (hidden && t) hidden.value = t.name;
}

function saveNewAssignment() {
  const title = document.getElementById('assignTitle').value.trim();
  if (!title) { showToast("Title is required", "warning"); return; }
  const maxId = Math.max(0, ...state.assignments.map(a => a.id));
  state.assignments.push({
    id: maxId + 1, title,
    category: document.getElementById('assignCategory').value || 'Homework',
    due: document.getElementById('assignDue').value,
    points: parseInt(document.getElementById('assignPoints').value) || 20,
    status: 'Not Started', score: null, feedback: null,
    instructions: document.getElementById('assignInstructions').value.trim(),
    resource: document.getElementById('assignResource').value.trim(),
  });
  state.notifications.unshift({ id: Date.now(), text: `New assignment: ${title}`, time: "Just now", read: false });
  saveState();
  showToast("Assignment created ✓", "success");
  closeModal();
  renderPage(currentPage);
}

function openAssignment(id) {
  const a = state.assignments.find(x => x.id === id);
  if (!a) return;
  openModal(`
    <h2><i class="fas fa-tasks"></i> ${escapeHtml(a.title)}</h2>
    <div style="display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap;">
      <span class="grade-badge" style="background: var(--primary-light); color: var(--primary);">${escapeHtml(a.category)}</span>
      <span class="grade-badge" style="background: var(--info-light); color: var(--info);">Due ${a.due}</span>
      <span class="grade-badge" style="background: var(--secondary-light); color: #C48A1A;">${a.points} points</span>
      <span class="status-badge status-${a.status.toLowerCase().replace(/\s+/g, '-')}">${a.status}</span>
    </div>
    ${a.instructions ? `<div style="background: var(--bg); border-radius: 12px; padding: 18px; margin-bottom: 16px; font-size: 0.9rem; line-height: 1.7;">${escapeHtml(a.instructions)}</div>` : ''}
    ${a.resource ? `<div style="margin-bottom: 16px;"><a href="${escapeHtml(a.resource)}" target="_blank" class="btn btn-outline btn-sm"><i class="fas fa-link"></i> Open Resource</a></div>` : ''}
    ${a.score !== null ? `
      <div class="feedback-item">
        <div class="meta"><span>Your Score</span></div>
        <div style="font-size: 1.6rem; font-weight: 800; color: var(--primary);">${a.score} / ${a.points}</div>
        ${a.feedback ? `<div style="margin-top: 8px; font-size: 0.9rem;"><strong>Feedback:</strong> ${escapeHtml(a.feedback)}</div>` : ''}
      </div>
    ` : ''}
    <div class="actions">
      ${!teacherMode && a.status !== 'Graded' && a.status !== 'Submitted' ? `<button class="btn btn-primary" onclick="submitAssignment(${a.id})"><i class="fas fa-paper-plane"></i> Submit</button>` : ''}
      ${teacherMode && a.status !== 'Graded' ? `<button class="btn btn-success" onclick="closeModal(); gradeAssignment(${a.id})"><i class="fas fa-star"></i> Grade</button>` : ''}
      <button class="btn btn-outline" onclick="closeModal()">Close</button>
    </div>
  `);
}

function submitAssignment(id) {
  const a = state.assignments.find(x => x.id === id);
  if (!a) return;
  a.status = 'Submitted';
  saveState();
  showToast("Assignment submitted! ✓", "success");
  addXP(20, "for submitting!");
  closeModal();
  renderPage(currentPage);
}

function gradeAssignment(id) {
  const a = state.assignments.find(x => x.id === id);
  if (!a) return;
  openModal(`
    <h2><i class="fas fa-star"></i> Grade Assignment</h2>
    <p style="font-size: 0.9rem; margin-bottom: 16px;">${escapeHtml(a.title)}</p>
    <div class="form-group"><label>Score (out of ${a.points})</label><input type="number" id="gradeScore" value="${a.score || a.points}" min="0" max="${a.points}"></div>
    <div class="form-group"><label>Feedback</label><textarea id="gradeFeedback">${escapeHtml(a.feedback || '')}</textarea></div>
    <div class="actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-success" onclick="saveGrade(${a.id})"><i class="fas fa-check"></i> Save Grade</button>
    </div>
  `);
}

function saveGrade(id) {
  const a = state.assignments.find(x => x.id === id);
  if (!a) return;
  const score = parseInt(document.getElementById('gradeScore').value);
  a.score = isNaN(score) ? 0 : score;
  a.feedback = document.getElementById('gradeFeedback').value.trim();
  a.status = 'Graded';
  saveState();
  showToast("Grade saved ✓ — Gradebook updated", "success");
  closeModal();
  renderPage(currentPage);
}

function editAssignment(id) {
  const a = state.assignments.find(x => x.id === id);
  if (!a) return;
  openModal(`
    <h2><i class="fas fa-edit"></i> Edit Assignment</h2>
    <div class="form-group"><label>Title</label><input type="text" id="editAssignTitle" value="${escapeHtml(a.title)}"></div>
    <div class="form-group"><label>Type</label>
      <select id="editAssignCategory">${state.assignmentTypes.map(t => `<option ${t.name === a.category ? 'selected' : ''}>${t.name}</option>`).join('')}</select>
    </div>
    <div class="form-group"><label>Due Date</label><input type="date" id="editAssignDue" value="${a.due}"></div>
    <div class="form-group"><label>Points</label><input type="number" id="editAssignPoints" value="${a.points}" min="1"></div>
    <div class="form-group"><label>Instructions</label><textarea id="editAssignInstructions" style="min-height: 100px;">${escapeHtml(a.instructions || '')}</textarea></div>
    <div class="form-group"><label>Resource URL</label><input type="url" id="editAssignResource" value="${escapeHtml(a.resource || '')}"></div>
    <div class="form-group"><label>Status</label>
      <select id="editAssignStatus">${['Not Started','In Progress','Submitted','Graded','Overdue'].map(s => `<option ${s === a.status ? 'selected' : ''}>${s}</option>`).join('')}</select>
    </div>
    <div class="actions">
      <button class="btn btn-outline" onclick="deleteAssignment(${a.id})" style="margin-right: auto; color: var(--danger); border-color: var(--danger);"><i class="fas fa-trash"></i> Delete</button>
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveEditAssignment(${a.id})"><i class="fas fa-save"></i> Save</button>

}

function saveEditAssignment(id) {
  const a = state.assignments.find(x => x.id === id);
  if (!a) return;
  a.title = document.getElementById('editAssignTitle').value.trim();
  a.category = document.getElementById('editAssignCategory').value;
  a.due = document.getElementById('editAssignDue').value;
  a.points = parseInt(document.getElementById('editAssignPoints').value) || 20;
  a.instructions = document.getElementById('editAssignInstructions').value.trim();
  a.resource = document.getElementById('editAssignResource').value.trim();
  a.status = document.getElementById('editAssignStatus').value;
  saveState();
  showToast("Assignment saved ✓", "success");
  closeModal();
  renderPage(currentPage);
}

function deleteAssignment(id) {
  confirmAction("Delete Assignment?", "This will permanently delete this assignment.", () => {
    state.assignments = state.assignments.filter(a => a.id !== id);
    saveState();
    showToast("Assignment deleted", "info");
    closeModal();
    renderPage(currentPage);

}

/* ============================================================
   QUIZZES
   ============================================================ */
function renderQuizzes() {
  const upcoming = state.quizzes.filter(q => (state.quizAttempts[q.id]?.attempts || 0) < 3);
  const completed = state.quizzes.filter(q => (state.quizAttempts[q.id]?.attempts || 0) >= 3);
  return `
    <div class="section-header">
      <div><h2>Quizzes</h2><p class="subtitle">Practice quizzes · 3 attempts allowed</p></div>
      ${teacherMode ? `<button class="btn btn-primary btn-sm" onclick="openQuizBuilder()"><i class="fas fa-plus"></i> Build Quiz</button>` : `<span class="lock-notice"><i class="fas fa-lock"></i> Teacher creates quizzes</span>`}
    </div>
    ${upcoming.length > 0 ? `
      <div class="section-header" style="margin-bottom: 12px;"><h3 style="font-size: 1rem; font-weight: 700;"><i class="fas fa-clock" style="color: var(--primary); margin-right: 8px;"></i>Available</h3></div>
      <div class="two-col" style="margin-bottom: 28px;">
        ${upcoming.map(q => {
          const attempts = state.quizAttempts[q.id]?.attempts || 0;
          const bestScore = state.quizAttempts[q.id]?.scores?.length > 0 ? Math.max(...state.quizAttempts[q.id].scores) : null;
          const rewardBadge = q.rewardBadgeId ? state.badges.find(b => b.id === q.rewardBadgeId) : null;
          return `
            <div class="card">
              ${rewardBadge ? `<div style="display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--secondary-light); border-radius: 10px; margin-bottom: 12px; font-size: 0.75rem; font-weight: 700; color: #C48A1A;">
                <span style="font-size: 1.2rem;">${rewardBadge.icon}</span> Earns: ${escapeHtml(rewardBadge.name)}
              </div>` : ''}
              <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                <span class="grade-badge" style="background: var(--primary-light); color: var(--primary);">${escapeHtml(q.category || 'Quiz')}</span>
              </div>
              <h3 style="font-size: 1.05rem; font-weight: 700; margin-bottom: 8px;">${escapeHtml(q.title)}</h3>
              <p style="font-size: 0.82rem; color: var(--text-light); margin-bottom: 14px;">${escapeHtml(q.description || '')}</p>
              <div class="attempt-indicator" style="margin-bottom: 12px;">
                <span>Attempts:</span>
                ${[1,2,3].map(i => `<div class="attempt-dot ${i <= attempts ? 'used' : ''}"></div>`).join('')}
                <span>(${attempts}/3)</span>
                ${bestScore !== null ? `<span style="margin-left: auto; font-weight: 800; color: var(--success);">Best: ${bestScore}%</span>` : ''}
              </div>
              <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                <button class="btn btn-primary btn-sm" onclick="openQuizIntro(${q.id})"><i class="fas fa-play"></i> Take Quiz</button>
                ${teacherMode ? `
                  <button class="btn btn-outline btn-sm" onclick="openQuizBuilder(${q.id})"><i class="fas fa-edit"></i></button>
                  <button class="btn btn-outline btn-sm" onclick="deleteQuiz(${q.id})"><i class="fas fa-trash"></i></button>
                ` : ''}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    ` : ''}
    ${completed.length > 0 ? `
      <div class="section-header" style="margin-bottom: 12px;"><h3 style="font-size: 1rem; font-weight: 700;"><i class="fas fa-check-circle" style="color: var(--success); margin-right: 8px;"></i>Completed</h3></div>
      <div class="two-col">
        ${completed.map(q => {
          const bestScore = state.quizAttempts[q.id]?.scores?.length > 0 ? Math.max(...state.quizAttempts[q.id].scores) : 0;
          return `
            <div class="card" style="opacity: 0.85;">
              <span class="status-badge status-completed">Completed</span>
              <h3 style="font-size: 1.05rem; font-weight: 700; margin: 8px 0;">${escapeHtml(q.title)}</h3>
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <span class="grade-badge ${bestScore >= 90 ? 'a' : bestScore >= 70 ? 'b' : 'd'}">${bestScore}%</span>
                ${teacherMode ? `<button class="btn btn-outline btn-sm" onclick="deleteQuiz(${q.id})"><i class="fas fa-trash"></i></button>` : ''}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    ` : ''}
    ${state.quizzes.length === 0 ? `<div class="card"><div class="empty-state"><i class="fas fa-question-circle"></i><p>No quizzes yet. ${teacherMode ? 'Click "Build Quiz" to create one.' : 'Your teacher will add quizzes soon.'}</p></div></div>` : ''}
